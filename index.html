<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面具之下：失名之夜</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6efe2;
      --muted: rgba(246, 239, 226, 0.68);
      --gold: #e6bd6d;
      --gold-bright: #ffd98c;
      --blue: #244e84;
      --blue-deep: #07111f;
      --red: #8b2530;
      --panel: rgba(7, 13, 23, 0.9);
      --panel-soft: rgba(14, 23, 37, 0.78);
      --line: rgba(255, 222, 155, 0.22);
      --success: #91d4b3;
      --danger: #ff8d8d;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080d;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    #stage {
      width: 100vw;
      height: 100vh;
      min-height: 620px;
    }

    .game-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: #08101b;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      transform: scale(1.015);
      animation: scene-in 260ms var(--ease) both;
    }

    .scene-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2, 5, 10, 0.2), transparent 26%, transparent 62%, rgba(2, 5, 10, 0.76)),
        radial-gradient(circle at center, transparent 40%, rgba(2, 5, 10, 0.22) 100%);
    }

    @keyframes scene-in {
      from { opacity: 0; transform: scale(1.025); }
      to { opacity: 1; transform: scale(1.015); }
    }

    .top-hud {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 24px;
      pointer-events: none;
    }

    .case-mark,
    .objective-chip,
    .progress-chip {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: rgba(6, 12, 21, 0.76);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
    }

    .case-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 198px;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .case-number {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 221, 153, 0.42);
      border-radius: 50%;
      color: var(--gold-bright);
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .case-copy strong,
    .objective-chip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    .case-copy span,
    .objective-chip span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .objective-chip {
      max-width: 460px;
      padding: 10px 16px;
      border-radius: 999px;
      text-align: center;
    }

    .progress-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .hud-evidence-button {
      pointer-events: auto;
      flex: 0 0 auto;
    }

    .progress-dots {
      display: flex;
      gap: 5px;
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.done {
      background: var(--gold);
      box-shadow: 0 0 10px rgba(230, 189, 109, 0.7);
    }

    .scene-title {
      position: absolute;
      z-index: 8;
      left: 28px;
      bottom: 205px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 2px 12px #000;
      pointer-events: none;
    }

    .scene-title::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--gold);
    }

    .scene-title span {
      font-size: 12px;
      letter-spacing: 0.28em;
    }

    .hotspot {
      --size: 44px;
      position: absolute;
      z-index: 15;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      margin: calc(var(--size) / -2);
      padding: 0;
      border: 1px solid rgba(255, 222, 160, 0.78);
      border-radius: 50%;
      background: rgba(10, 18, 30, 0.42);
      box-shadow:
        0 0 0 7px rgba(230, 189, 109, 0.1),
        0 0 24px rgba(230, 189, 109, 0.34);
      cursor: pointer;
      transition: transform 180ms ease-out, background 180ms ease-out, border-color 180ms ease-out;
      animation: hotspot-pulse 1.8s ease-in-out infinite;
    }

    .hotspot::before,
    .hotspot::after {
      content: "";
      position: absolute;
      background: var(--gold-bright);
      opacity: 0.92;
    }

    .hotspot::before {
      width: 14px;
      height: 2px;
      left: 14px;
      top: 20px;
    }

    .hotspot::after {
      width: 2px;
      height: 14px;
      left: 20px;
      top: 14px;
    }

    .hotspot-label {
      position: absolute;
      top: 50%;
      left: calc(100% + 12px);
      width: max-content;
      max-width: 170px;
      padding: 6px 9px;
      transform: translateY(-50%);
      border-radius: 6px;
      background: rgba(4, 9, 16, 0.88);
      color: #fff5dc;
      font-size: 11px;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease-out, transform 150ms ease-out;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      transform: scale(1.08);
      background: rgba(122, 83, 25, 0.68);
      outline: none;
    }

    .hotspot:hover .hotspot-label,
    .hotspot:focus-visible .hotspot-label {
      opacity: 1;
      transform: translate(2px, -50%);
    }

    .hotspot.inspected {
      border-color: rgba(145, 212, 179, 0.82);
      box-shadow: 0 0 0 6px rgba(145, 212, 179, 0.08);
      animation: none;
    }

    .hotspot.inspected::before,
    .hotspot.inspected::after {
      background: var(--success);
    }

    @keyframes hotspot-pulse {
      0%, 100% { box-shadow: 0 0 0 5px rgba(230, 189, 109, 0.08), 0 0 18px rgba(230, 189, 109, 0.22); }
      50% { box-shadow: 0 0 0 10px rgba(230, 189, 109, 0.02), 0 0 28px rgba(230, 189, 109, 0.48); }
    }

    .dialogue-wrap {
      position: absolute;
      z-index: 30;
      left: 24px;
      right: 24px;
      bottom: 24px;
      min-height: 158px;
      display: grid;
      grid-template-columns: 118px 1fr auto;
      align-items: stretch;
      border: 1px solid rgba(255, 222, 160, 0.26);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(15, 27, 44, 0.96), rgba(5, 10, 18, 0.94));
      box-shadow:
        0 22px 70px rgba(0,0,0,0.48),
        inset 0 1px rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      animation: dialogue-in 220ms var(--ease) both;
    }

    @keyframes dialogue-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .portrait {
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line);
      border-radius: 14px 0 0 14px;
      background-color: #101a2a;
      background-repeat: no-repeat;
      background-size: 400% auto;
      background-position: 0% 7%;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(4, 9, 16, 0.82));
      pointer-events: none;
    }

    .portrait.sprite {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(245, 224, 170, 0.16), transparent 44%),
        #0c1624;
    }

    .sprite-mark {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 64px;
      height: 52px;
      border: 2px solid var(--gold);
      border-radius: 58% 42% 55% 45%;
      color: var(--gold-bright);
      font-family: Georgia, serif;
      font-size: 24px;
      transform: rotate(-5deg);
      box-shadow: 0 0 24px rgba(230,189,109,.22);
    }

    .dialogue-copy {
      min-width: 0;
      padding: 20px 22px 18px;
    }

    .speaker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 23px;
      margin-bottom: 10px;
    }

    .speaker-name {
      color: var(--gold-bright);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    .speaker-line {
      width: 32px;
      height: 1px;
      background: rgba(230,189,109,.45);
    }

    .dialogue-text {
      max-width: 940px;
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: clamp(16px, 1.5vw, 21px);
      line-height: 1.65;
      letter-spacing: 0.025em;
      text-shadow: 0 2px 12px rgba(0,0,0,.5);
    }

    .dialogue-actions {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      width: 132px;
      padding: 16px;
      border-left: 1px solid var(--line);
    }

    .dialogue-counter {
      color: rgba(255,255,255,.38);
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: .12em;
      text-align: center;
    }

    .ui-button,
    .advance-button,
    .next-scene-button,
    .association-button {
      min-height: 42px;
      border: 1px solid rgba(255,222,160,.28);
      border-radius: 8px;
      background: rgba(255,255,255,.055);
      cursor: pointer;
      transition: transform 150ms ease-out, background 150ms ease-out, border-color 150ms ease-out;
    }

    .ui-button:hover,
    .advance-button:hover,
    .next-scene-button:hover,
    .association-button:hover {
      background: rgba(230,189,109,.14);
      border-color: rgba(255,222,160,.62);
    }

    .ui-button:active,
    .advance-button:active,
    .next-scene-button:active,
    .association-button:active {
      transform: scale(.98);
    }

    .advance-button {
      background: linear-gradient(135deg, rgba(139,37,48,.92), rgba(95,23,32,.92));
      border-color: rgba(255,178,153,.34);
      font-weight: 800;
    }

    .advance-button::after { content: "  ›"; }

    .investigate-tip {
      position: absolute;
      z-index: 18;
      left: 50%;
      bottom: 178px;
      transform: translateX(-50%);
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5,10,18,.78);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      backdrop-filter: blur(12px);
    }

    .next-scene-button {
      position: absolute;
      z-index: 24;
      right: 28px;
      bottom: 204px;
      min-width: 250px;
      padding: 12px 18px;
      border-color: rgba(145,212,179,.48);
      background: rgba(17,76,55,.82);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
      font-weight: 800;
      animation: dialogue-in 220ms var(--ease) both;
    }

    .next-scene-button::after { content: "  →"; }

    .evidence-backdrop,
    .modal-backdrop {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(2, 5, 10, 0.68);
      backdrop-filter: blur(10px);
      animation: fade-in 180ms ease-out both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .evidence-book,
    .hook-card,
    .chapter-card {
      width: min(880px, 92vw);
      max-height: min(720px, 86vh);
      overflow: auto;
      border: 1px solid rgba(255,222,160,.3);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(19,32,51,.98), rgba(6,12,21,.98));
      box-shadow: 0 32px 100px rgba(0,0,0,.6);
      animation: modal-in 220ms var(--ease) both;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .book-header,
    .hook-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }

    .book-header h2,
    .hook-header h2,
    .chapter-card h2 {
      margin: 0;
      font-family: Georgia, "STSong", serif;
      font-size: 24px;
      letter-spacing: .06em;
    }

    .close-button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 20px 22px;
    }

    .evidence-card {
      min-height: 118px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      background: rgba(255,255,255,.035);
    }

    .evidence-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-bright);
      font-size: 14px;
    }

    .evidence-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .association-zone {
      margin: 0 22px 22px;
      padding: 18px;
      border: 1px dashed rgba(145,212,179,.35);
      border-radius: 12px;
      background: rgba(40,100,75,.08);
    }

    .association-zone h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    .association-zone p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .association-button {
      width: 100%;
      padding: 11px 14px;
      background: rgba(34,93,70,.46);
      border-color: rgba(145,212,179,.36);
      text-align: left;
    }

    .association-button + .association-button { margin-top: 8px; }

    .empty-evidence {
      grid-column: 1 / -1;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }

    .hook-card { width: min(680px, 92vw); }

    .hook-body {
      padding: 26px;
    }

    .hook-question {
      margin: 0 0 22px;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(21px, 2.3vw, 30px);
      line-height: 1.55;
    }

    .hook-note {
      margin: -10px 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .hook-input {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      padding: 15px;
      border: 1px solid rgba(255,222,160,.24);
      border-radius: 10px;
      outline: none;
      background: rgba(0,0,0,.22);
      color: #fff8e9;
      line-height: 1.7;
    }

    .hook-input:focus {
      border-color: rgba(255,217,140,.72);
      box-shadow: 0 0 0 3px rgba(230,189,109,.08);
    }

    .hook-submit {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 1px solid rgba(255,222,160,.32);
      border-radius: 9px;
      background: linear-gradient(135deg, #8b2530, #60202a);
      font-weight: 800;
      cursor: pointer;
    }

    .hook-submit:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .chapter-card {
      width: min(640px, 90vw);
      padding: 34px;
      text-align: center;
    }

    .chapter-kicker {
      display: block;
      margin-bottom: 12px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .28em;
    }

    .chapter-card p {
      max-width: 500px;
      margin: 18px auto 24px;
      color: var(--muted);
      line-height: 1.8;
    }

    .chapter-card button {
      min-width: 210px;
      padding: 13px 20px;
      border: 1px solid rgba(255,222,160,.34);
      border-radius: 9px;
      background: linear-gradient(135deg, #8b2530, #60202a);
      font-weight: 800;
      cursor: pointer;
    }

    .deduction-card {
      width: min(760px, 92vw);
      padding: 30px;
      border: 1px solid rgba(255,222,160,.34);
      border-radius: 18px;
      background: linear-gradient(150deg, rgba(17,29,48,.98), rgba(4,9,17,.98));
      box-shadow: 0 30px 90px rgba(0,0,0,.65);
      animation: modal-in 220ms var(--ease) both;
    }

    .deduction-card small {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: .24em;
    }

    .deduction-card h2 {
      margin: 10px 0 8px;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(25px, 3.4vw, 38px);
    }

    .deduction-card > p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .deduction-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .deduction-option {
      min-height: 116px;
      padding: 18px;
      border: 1px solid rgba(87,171,221,.35);
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(29,56,84,.85), rgba(10,22,39,.9));
      text-align: left;
      cursor: pointer;
      transition: transform 140ms var(--ease), border-color 140ms ease, background 140ms ease;
    }

    .deduction-option:hover,
    .deduction-option:focus-visible {
      transform: translateY(-3px);
      border-color: var(--gold);
      background: linear-gradient(160deg, rgba(57,73,87,.92), rgba(26,34,43,.96));
      outline: none;
    }

    .deduction-option strong,
    .deduction-option span { display: block; }
    .deduction-option strong { margin-bottom: 8px; color: #fff4d8; font-size: 17px; }
    .deduction-option span { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .title-screen {
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .title-screen .scene-bg::after {
      background:
        linear-gradient(90deg, rgba(3,7,12,.92) 0%, rgba(3,7,12,.68) 45%, rgba(3,7,12,.22) 100%),
        linear-gradient(180deg, rgba(3,7,12,.22), rgba(3,7,12,.76));
    }

    .title-panel {
      position: relative;
      z-index: 5;
      width: min(780px, 88vw);
      margin-right: 28vw;
      padding: 38px 42px;
      border-left: 2px solid var(--gold);
      background: linear-gradient(90deg, rgba(4,9,16,.82), rgba(4,9,16,.16));
      text-shadow: 0 3px 20px #000;
      animation: dialogue-in 260ms var(--ease) both;
    }

    .title-case {
      display: block;
      margin-bottom: 16px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .32em;
    }

    .title-panel h1 {
      margin: 0;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(38px, 5.5vw, 76px);
      line-height: 1.05;
      letter-spacing: .08em;
    }

    .title-panel h1 small {
      display: block;
      margin-top: 10px;
      color: rgba(255,255,255,.72);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: .25em;
      font-weight: 500;
      letter-spacing: .38em;
    }

    .title-panel p {
      max-width: 600px;
      margin: 24px 0 28px;
      color: rgba(255,255,255,.72);
      line-height: 1.85;
    }

    .start-button {
      min-width: 210px;
      padding: 14px 22px;
      border: 1px solid rgba(255,220,150,.5);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(139,37,48,.96), rgba(89,22,31,.96));
      box-shadow: 0 12px 35px rgba(0,0,0,.36);
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform 150ms ease-out, filter 150ms ease-out;
    }

    .start-button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .start-button:active { transform: translateY(0) scale(.98); }

    .title-meta {
      display: inline-block;
      margin-left: 16px;
      color: rgba(255,255,255,.48);
      font-size: 11px;
    }

    /* Variant 2: permanent notebook rails */
    .variant-notebook {
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr) 270px;
      padding: 14px;
      gap: 12px;
      background: #0b1018;
    }

    .variant-notebook .scene-bg {
      inset: 14px 282px 14px 250px;
      border-radius: 12px;
      overflow: hidden;
      transform: none;
    }

    .variant-notebook .top-hud { display: none; }

    .notebook-rail {
      position: relative;
      z-index: 35;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: #111a27;
      box-shadow: 0 16px 50px rgba(0,0,0,.28);
    }

    .notebook-left { grid-column: 1; }
    .notebook-right { grid-column: 3; }

    .rail-header {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .rail-header small {
      color: var(--gold);
      font-size: 10px;

      .deduction-option { min-height: 84px; }
      .dialogue-wrap,
      .game-shell.evidence-collapsed .dialogue-wrap {
        min-height: 190px;
        grid-template-columns: 1fr 82px;
      }
      .dialogue-copy { padding: 32px 18px 20px 32px; }
      .dialogue-text { font-size: 20px; }
      .speaker-row { left: 18px; width: 166px; }
      .speaker-name { font-size: 15px; }
      .dialogue-actions { width: 82px; padding: 8px; }
      .advance-button::before { font-size: 52px; }
      .stage-speaker { width: min(460px, 78vw); bottom: 184px; height: calc(100vh - 198px); }
      .stage-speaker.speaker-shiyi { width: min(270px, 56vw); bottom: 174px; }
      .scene-title { display: none; }
    }

    @media (max-height: 620px) {
      #stage { height: 100dvh; min-height: 0; }
      .talk-button { bottom: 14px; }
      .investigate-tip { bottom: 14px; }
      .evidence-tab { top: 10px; }
      .audio-controls { top: 10px; }
    }

    /* Feedback pass: save/return controls, chapter map, and a full court-record view. */
    .system-controls {
      position: absolute;
      z-index: 46;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 6px;
    }

    .system-button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 5px;
      background: rgba(5, 15, 28, .88);
      color: #f4f7fb;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .05em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }

    .system-button:hover,
    .system-button:focus-visible {
      border-color: #ffc92f;
      color: #ffe59a;
      outline: none;
    }

    .scene-title { top: 66px; }

    .system-toast {
      position: absolute;
      z-index: 130;
      top: 64px;
      left: 50%;
      padding: 9px 16px;
      border: 1px solid rgba(255,215,92,.68);
      border-radius: 5px;
      background: rgba(5,16,28,.94);
      color: #ffe9aa;
      font-size: 12px;
      font-weight: 760;
      transform: translateX(-50%);
      box-shadow: 0 12px 34px rgba(0,0,0,.38);
      animation: toast-in 180ms ease-out both;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, -6px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .dialogue-exit-button {
      position: absolute;
      right: 116px;
      top: 13px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(144,211,241,.48);
      border-radius: 4px;
      background: rgba(10,31,54,.86);
      color: #cbefff;
      font-size: 11px;
      cursor: pointer;
    }

    .dialogue-exit-button:hover,
    .dialogue-exit-button:focus-visible {
      border-color: #ffd24d;
      color: #fff1bd;
      outline: none;
    }

    .court-record-backdrop,
    .chapter-map-backdrop,
    .alias-backdrop,
    .evidence-acquired-overlay {
      position: absolute;
      inset: 0;
      z-index: 82;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(2, 7, 13, .76);
      backdrop-filter: blur(5px);
    }

    .court-record {
      width: min(980px, calc(100vw - 56px));
      max-height: min(670px, calc(100vh - 56px));
      overflow: hidden;
      border: 7px double #787467;
      border-radius: 8px;
      background: #d9d7cf;
      color: #182126;
      box-shadow: 0 24px 70px rgba(0,0,0,.62), inset 0 0 0 2px #f5f2e9;
      animation: record-open 210ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes record-open {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: none; }
    }

    .record-header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 22px;
      border-bottom: 3px solid #8f8a78;
      background: #273238;
      color: white;
    }

    .record-header small {
      display: block;
      color: #8dc9df;
      font-size: 9px;
      letter-spacing: .22em;
    }

    .record-header strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      letter-spacing: .08em;
    }

    .record-close {
      min-width: 78px;
      min-height: 34px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 4px;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .record-close:hover,
    .record-close:focus-visible { border-color: #ffd052; color: #ffd052; outline: none; }

    .record-main {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 18px;
      min-height: 330px;
      padding: 18px 20px 14px;
    }

    .record-large-frame {
      align-self: start;
      padding: 12px;
      border: 2px solid #6d716e;
      background: #eef0eb;
      box-shadow: inset 0 0 0 5px #c8cac5;
    }

    .record-large-frame .evidence-icon {
      width: 100%;
      border: 0;
      border-radius: 0;
      background-color: #c9cfce;
      box-shadow: inset 0 0 26px rgba(24,38,41,.22);
    }

    .record-copy {
      min-width: 0;
      padding: 2px 0 0;
    }

    .record-copy h2 {
      margin: 0;
      padding: 10px 15px;
      background: #2b363a;
      color: #fff;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .record-description {
      min-height: 116px;
      margin-top: 8px;
      padding: 8px 14px 12px;
      background: #8bb39b;
      font-size: 16px;
      line-height: 1.75;
    }

    .record-description span {
      display: block;
      min-height: 29px;
      border-bottom: 1px solid rgba(31,67,54,.28);
    }

    .record-copy .association-zone {
      margin: 10px 0 0;
      padding: 10px 12px;
      border: 1px solid rgba(31,56,66,.3);
      border-radius: 4px;
      background: rgba(255,255,255,.46);
      color: #243138;
    }

    .record-copy .association-zone h3 { margin: 0 0 4px; font-size: 13px; }
    .record-copy .association-zone p { margin: 0; color: #4e5a5e; font-size: 11px; line-height: 1.5; }
    .record-copy .association-button { margin-top: 7px; padding: 8px 10px; font-size: 11px; }

    .record-strip-shell {
      padding: 12px 18px 16px;
      border-top: 3px solid #aaa797;
      background: #efeee7;
    }

    .record-strip-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #5f625e;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .record-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 7px;
    }

    .record-strip .evidence-entry {
      position: relative;
      flex: 0 0 78px;
      display: block;
      margin: 0;
      padding: 5px;
      border: 3px solid transparent;
      border-radius: 2px;
      background: #bdbdb8;
      color: #1c282d;
      cursor: pointer;
    }

    .record-strip .evidence-entry:hover,
    .record-strip .evidence-entry:focus-visible,
    .record-strip .evidence-entry.is-selected {
      border-color: #d32f2f;
      background: #f3f1e8;
      outline: none;
    }

    .record-strip .evidence-entry .evidence-icon { width: 62px; margin: auto; border-radius: 2px; }
    .record-strip .evidence-entry strong {
      display: block;
      overflow: hidden;
      margin: 4px 0 0;
      color: #273238;
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .evidence-tab {
      right: 16px;
      border-radius: 6px;
    }

    .evidence-tab:not(.closed) { right: 16px; }
    .evidence-rail { display: none; }

    .evidence-acquired-overlay {
      z-index: 116;
      grid-template-rows: 1fr;
      align-items: center;
      box-sizing: border-box;
      padding: clamp(18px, 5vw, 64px) clamp(16px, 7vw, 120px) 196px;
      background: rgba(1, 6, 12, .58);
    }

    .evidence-acquired-card {
      position: relative;
      width: min(900px, 90vw);
      display: grid;
      grid-template-columns: minmax(180px, 29%) 1fr;
      gap: 26px;
      padding: 30px 34px;
      border: 5px solid #f8f6ef;
      outline: 4px solid #2c93bd;
      background: #f7f6f0;
      color: #11191c;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      animation: evidence-card-arrive 360ms cubic-bezier(.16,.86,.28,1.12) both;
    }

    .evidence-acquired-card::before,
    .evidence-acquired-card::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #56bee5;
      pointer-events: none;
    }

    .evidence-acquired-card::before { left: -17px; top: -17px; border-left: 6px solid #56bee5; border-top: 6px solid #56bee5; }
    .evidence-acquired-card::after { right: -17px; bottom: -17px; border-right: 6px solid #56bee5; border-bottom: 6px solid #56bee5; }

    @keyframes evidence-card-arrive {
      0% { opacity: 0; transform: scale(.72) rotate(-1deg); }
      68% { opacity: 1; transform: scale(1.025) rotate(.15deg); }
      100% { transform: none; }
    }

    .acquired-visual {
      padding: 10px;
      background: #c8cbc9;
      box-shadow: inset 0 0 0 2px #a5aaa8;
    }

    .acquired-visual .evidence-icon { width: 100%; border: 0; border-radius: 0; }

    .acquired-copy h2 {
      margin: 0;
      padding: 3px 12px 5px;
      background: #ffc52d;
      font-size: clamp(24px, 3.4vw, 42px);
      font-weight: 650;
      letter-spacing: .04em;
    }

    .acquired-copy p {
      margin: 20px 0 0;
      padding: 0 10px 14px;
      border-bottom: 1px dashed #747a79;
      font-size: clamp(16px, 2vw, 25px);
      line-height: 1.75;
    }

    .acquired-dialogue {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      min-height: 176px;
      display: grid;
      grid-template-columns: 1fr 132px;
      align-items: center;
      padding-left: clamp(28px, 15vw, 230px);
      border-top: 4px solid rgba(255,255,255,.8);
      background: #071328;
      color: #6ac8ee;
      box-shadow: 0 -14px 40px rgba(0,0,0,.3);
    }

    .acquired-dialogue p {
      margin: 0;
      font-size: clamp(22px, 3vw, 38px);
      line-height: 1.5;
      letter-spacing: .035em;
    }

    .acquired-dialogue button {
      position: relative;
      align-self: stretch;
      border: 0;
      background: transparent;
      color: #ffc82d;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .12em;
      cursor: pointer;
    }

    .acquired-dialogue button::before {
      content: "≫";
      display: block;
      margin-bottom: 4px;
      color: #ffc82d;
      font-family: Arial Black, sans-serif;
      font-size: 64px;
      line-height: .75;
      letter-spacing: -.28em;
      text-shadow: 3px 3px 0 #7a5200;
      animation: next-pulse 1.1s ease-in-out infinite;
    }

    .acquired-dialogue button:hover,
    .acquired-dialogue button:focus-visible {
      background: rgba(255, 200, 45, .08);
      outline: 3px solid rgba(255, 210, 77, .72);
      outline-offset: -7px;
    }

    .acquired-dialogue-hint {
      display: block;
      margin-top: 7px;
      color: rgba(162,219,244,.66);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .chapter-map-card,
    .alias-card {
      width: min(820px, 92vw);
      max-height: 84vh;
      overflow: auto;
      border: 2px solid rgba(111,205,242,.7);
      border-radius: 8px;
      background: #07172a;
      color: #eef9ff;
      box-shadow: 0 24px 70px rgba(0,0,0,.6);
    }

    .chapter-map-header,
    .alias-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(120,208,245,.24);
    }

    .chapter-map-header h2,
    .alias-header h2 { margin: 0; font-size: 24px; }

    .chapter-map-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      padding: 18px 22px 22px;
    }

    .chapter-map-item {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 10px 12px;
      border-left: 4px solid rgba(124,152,169,.36);
      background: rgba(255,255,255,.045);
      color: rgba(255,255,255,.5);
    }

    .chapter-map-item.is-current { border-left-color: #ffd24d; color: white; background: rgba(255,210,77,.08); }
    .chapter-map-item.is-done { border-left-color: #55d5a4; color: #d8fff0; }
    .chapter-map-index { font: 800 22px/1 Georgia, serif; text-align: center; }
    .chapter-map-item strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .chapter-map-item span:last-child { font-size: 10px; }

    .alias-body { padding: 24px; }
    .alias-question { margin: 0 0 12px; font-size: clamp(20px,3vw,30px); line-height: 1.45; }
    .alias-note { color: rgba(255,255,255,.58); font-size: 12px; line-height: 1.6; }
    .alias-input {
      width: 100%;
      min-height: 54px;
      margin: 12px 0 16px;
      padding: 0 14px;
      border: 1px solid rgba(116,210,247,.5);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 18px;
    }
    .alias-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .alias-actions button { min-height: 42px; padding: 0 18px; border-radius: 4px; cursor: pointer; }
    .alias-submit { border: 1px solid #ffd24d; background: #ffd24d; color: #17202a; font-weight: 800; }
    .alias-submit:disabled { opacity: .38; cursor: not-allowed; }
    .alias-cancel { border: 1px solid rgba(255,255,255,.28); background: transparent; color: white; }

    .story-choice-backdrop {
      z-index: 80;
      background:
        radial-gradient(circle at 50% 42%, rgba(24,93,120,.22), transparent 38%),
        rgba(1,7,14,.82);
      backdrop-filter: blur(7px);
    }

    .story-choice-card {
      width: min(720px, 92vw);
      max-height: 88vh;
      overflow: auto;
      padding: 30px;
      border: 2px solid rgba(93,200,239,.78);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(9,27,47,.98), rgba(4,14,27,.98));
      color: #eef9ff;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0,0,0,.68), inset 0 0 0 4px rgba(255,255,255,.025);
      animation: story-card-in 240ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes story-card-in {
      from { opacity: 0; transform: translateY(14px) scale(.975); }
      to { opacity: 1; transform: none; }
    }

    .story-choice-card small {
      display: block;
      margin: 4px 0 8px;
      color: #72ceee;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .story-choice-card h2 { margin: 0; font: 700 clamp(28px,4vw,42px)/1.2 Georgia,"STSong",serif; }
    .story-choice-card > p { max-width: 590px; margin: 16px auto 24px; color: rgba(238,249,255,.72); line-height: 1.75; }

    .story-object {
      position: relative;
      width: 176px;
      margin: 0 auto 18px;
    }

    .story-object-icon,
    .unlock-key-icon {
      width: 100%;
      aspect-ratio: 1;
      border: 6px solid #9ba6a7;
      background-color: #d4d6d2;
      background-repeat: no-repeat;
      background-size: 500% 400%;
      box-shadow: 0 13px 34px rgba(0,0,0,.4), inset 0 0 0 2px #f5f1e9;
    }

    .wax-seal {
      position: absolute;
      right: 19px;
      bottom: 20px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 3px solid #7a111c;
      border-radius: 50%;
      background: #b42230;
      color: #ffd2a7;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,.42);
      animation: seal-pulse 1.7s ease-in-out infinite;
    }

    @keyframes seal-pulse { 50% { transform: scale(1.06); filter: brightness(1.16); } }

    .story-primary-button,
    .story-secondary-button {
      min-height: 48px;
      padding: 10px 20px;
      border-radius: 5px;
      font: inherit;
      cursor: pointer;
    }

    .story-primary-button { border: 1px solid #ffd24d; background: #ffd24d; color: #17202a; font-weight: 850; }
    .story-secondary-button { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.045); color: #eef9ff; }
    .story-primary-button:hover,
    .story-primary-button:focus-visible,
    .story-secondary-button:hover,
    .story-secondary-button:focus-visible { transform: translateY(-1px); filter: brightness(1.1); outline: 3px solid rgba(111,207,242,.32); outline-offset: 3px; }

    .story-choice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .story-choice-actions button { display: grid; gap: 4px; text-align: left; }
    .story-choice-actions strong { font-size: 18px; }
    .story-choice-actions span { font-size: 11px; font-weight: 500; opacity: .7; }

    .lock-interaction {
      position: relative;
      width: 260px;
      height: 150px;
      margin: 0 auto 16px;
    }

    .jar-lock {
      position: absolute;
      left: 34px;
      top: 18px;
      width: 92px;
      height: 110px;
      border: 7px double #b88735;
      border-radius: 18px 18px 30px 30px;
      background: linear-gradient(160deg, #526471, #172632 65%);
      box-shadow: inset 0 0 18px rgba(0,0,0,.7), 0 10px 28px rgba(0,0,0,.42);
    }

    .jar-lock::before {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: -18px;
      height: 19px;
      border: 5px solid #b88735;
      border-radius: 5px 5px 0 0;
      background: #233542;
    }

    .jar-lock span {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 18px;
      height: 33px;
      border-radius: 9px 9px 3px 3px;
      background: #09131c;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 0 3px rgba(232,190,100,.55);
    }

    .unlock-key-icon {
      position: absolute;
      right: 12px;
      top: 14px;
      width: 118px;
      transform: rotate(-12deg);
      animation: key-ready 1.2s ease-in-out infinite alternate;
    }

    @keyframes key-ready { to { transform: translateX(-10px) rotate(-4deg); } }

    .title-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .continue-button { border-color: rgba(110,213,244,.72); background: rgba(20,78,108,.86); }

    .game-shell.investigating .system-controls,
    .game-shell.investigating .system-controls *,
    .game-shell.investigating .court-record-backdrop,
    .game-shell.investigating .court-record-backdrop *,
    .game-shell.investigating .chapter-map-backdrop,
    .game-shell.investigating .chapter-map-backdrop * { cursor: pointer !important; }

    .acquired-dialogue small { font-size: .43em; color: rgba(132,211,244,.74); }

    @media (max-width: 760px) {
      .system-controls { top: 9px; left: 9px; gap: 4px; }
      .system-button { min-height: 34px; padding: 0 9px; font-size: 10px; }
      .court-record-backdrop { padding: 9px; }
      .court-record { width: calc(100vw - 18px); max-height: calc(100dvh - 18px); border-width: 4px; }
      .record-header { height: 48px; padding: 0 10px 0 13px; }
      .record-header strong { font-size: 16px; }
      .record-main { grid-template-columns: 118px minmax(0,1fr); gap: 9px; min-height: 230px; padding: 10px; }
      .record-large-frame { padding: 6px; }
      .record-copy h2 { padding: 7px 9px; font-size: 19px; }
      .record-description { min-height: 92px; margin-top: 5px; padding: 5px 8px; font-size: 12px; line-height: 1.5; }
      .record-description span { min-height: 22px; }
      .record-copy .association-zone { max-height: 90px; overflow: auto; margin-top: 6px; padding: 7px; }
      .record-copy .association-zone p { display: none; }
      .record-copy .association-button { margin-top: 5px; padding: 6px; font-size: 9px; }
      .record-strip-shell { padding: 8px 9px 10px; }
      .record-strip .evidence-entry { flex-basis: 65px; padding: 3px; }
      .record-strip .evidence-entry .evidence-icon { width: 55px; }
      .evidence-acquired-overlay { grid-template-rows: 1fr; padding: 54px 14px 150px; }
      .evidence-acquired-card { width: 94vw; grid-template-columns: 112px 1fr; gap: 12px; padding: 16px; outline-width: 2px; border-width: 3px; }
      .acquired-copy h2 { padding: 3px 7px; font-size: 20px; }
      .acquired-copy p { margin-top: 8px; padding: 0 4px 7px; font-size: 13px; line-height: 1.5; }
      .acquired-dialogue { min-height: 132px; grid-template-columns: 1fr 86px; padding-left: 22px; }
      .acquired-dialogue p { font-size: 20px; }
      .acquired-dialogue button::before { font-size: 48px; }
      .acquired-dialogue button { font-size: 12px; }
      .chapter-map-list { grid-template-columns: 1fr; padding: 12px; }
      .story-choice-card { padding: 22px 16px; }
      .story-choice-actions { grid-template-columns: 1fr; }
      .story-object { width: 132px; }
      .chapter-map-item { min-height: 52px; }
      .dialogue-exit-button { right: 76px; top: 9px; padding: 0 8px; }
      .scene-title { display: none; }
    }
  </style>
</head>
<body>
  <main id="stage"></main>

      "拾一": "方向不对。出示证物不是碰运气，要找能回答当前矛盾的那一件。"
    };

    const audioCatalog = {
      music: {
        investigation: { src: "assets/audio/music/investigation-mystery.mp3", gain: .36 },
        deduction: { src: "assets/audio/music/deduction-fast-mystery.ogg", gain: .3 },
        ending: { src: "assets/audio/music/ending-emotional-piano.ogg", gain: .38 }
      },
      sfx: {
        click: { src: "assets/audio/sfx/ui-click.ogg", gain: .34 },
        evidence: { src: "assets/audio/sfx/evidence-found.ogg", gain: .68 },
        unlock: { src: "assets/audio/sfx/unlock.ogg", gain: .72 },
        wrong: { src: "assets/audio/sfx/wrong-evidence.ogg", gain: .68 },
        impact: { src: "assets/audio/sfx/dramatic-impact.ogg", gain: .82 },
        spirit: { src: "assets/audio/sfx/spirit-emerge.ogg", gain: .74 }
      }
    };

    function readAudioPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem("lost-name-night-audio") || "{}");
        return {
          muted: Boolean(saved.muted),
          volume: Number.isFinite(saved.volume) ? Math.min(1, Math.max(0, saved.volume)) : .62
        };
      } catch (_) {
        return { muted: false, volume: .62 };
      }
    }

    const audioPreferences = readAudioPreferences();
    const audioState = {
      unlocked: false,
      muted: audioPreferences.muted,
      volume: audioPreferences.volume,
      currentMusic: null
    };
    const bgmPlayer = new Audio();
    bgmPlayer.loop = true;
    bgmPlayer.preload = "auto";
    const sfxPlayers = Object.fromEntries(Object.entries(audioCatalog.sfx).map(function(entry) {
      const player = new Audio(entry[1].src);
      player.preload = "auto";
      return [entry[0], player];
    }));

    function saveAudioPreferences() {
      try {
        localStorage.setItem("lost-name-night-audio", JSON.stringify({ muted: audioState.muted, volume: audioState.volume }));
      } catch (_) {}
    }

    function musicForCurrentState() {
      if (game.mode === "title") return null;
      if (game.mode === "ending" || ["finale", "epilogue"].includes(game.scene)) return "ending";
      if (game.mode === "deduction" || ["shadow", "assembly"].includes(game.scene)) return "deduction";
      return "investigation";
    }

    function syncBackgroundMusic() {
      const musicId = musicForCurrentState();
      if (!audioState.unlocked || audioState.muted || !musicId) {
        bgmPlayer.pause();
        return;
      }
      const track = audioCatalog.music[musicId];
      if (audioState.currentMusic !== musicId) {
        bgmPlayer.pause();
        bgmPlayer.src = track.src;
        bgmPlayer.currentTime = 0;
        audioState.currentMusic = musicId;
      }
      bgmPlayer.volume = Math.min(1, audioState.volume * track.gain);
      if (bgmPlayer.paused) bgmPlayer.play().catch(function() {});
    }

    function unlockAudio() {
      if (!audioState.unlocked) audioState.unlocked = true;
      syncBackgroundMusic();
    }

    function playSfx(id) {
      if (!audioState.unlocked || audioState.muted) return;
      const definition = audioCatalog.sfx[id];
      const source = sfxPlayers[id];
      if (!definition || !source) return;
      const player = source.cloneNode();
      player.volume = Math.min(1, audioState.volume * definition.gain);
      player.play().catch(function() {});
    }

    function playDialogueCue(text) {
      if (!text) return;
      if (text.includes("疼疼疼")) playSfx("spirit");
      else if (/异议|证据成立|完全一致|裂开|把它关掉|都会消失|失主是我/.test(text)) playSfx("impact");
    }

    function toggleAudio() {
      audioState.muted = !audioState.muted;
      saveAudioPreferences();
      render();
      if (!audioState.muted) playSfx("click");
    }

    function setAudioVolume(value) {
      audioState.volume = Math.min(1, Math.max(0, Number(value) || 0));
      bgmPlayer.volume = audioState.currentMusic
        ? Math.min(1, audioState.volume * audioCatalog.music[audioState.currentMusic].gain)
        : 0;
      saveAudioPreferences();
    }

    const game = {
      scene: "title",
      mode: "title",
      dialogue: [],
      dialogueIndex: 0,
      afterDialogue: null,
      inspected: {},
      evidence: [],
      flags: {},
      evidenceOpen: false,
      evidenceSelected: null,
      evidenceNoticeQueue: [],
      hookNumber: 0,
      hookText: "",
      hookAnswers: {},
      aliasText: "",
      alias: "",
      deductionStep: "owner",
      talked: {},
      talkSpeaker: null,
      presented: {},
      chapterData: null,
      chapterMapOpen: false,
      systemMessage: ""
    };

    const SAVE_KEY = "lost-name-night-save-v1";
    let systemMessageTimer = null;

    function addEvidence(ids) {
      const list = Array.isArray(ids) ? ids : [ids];
      const addedIds = [];
      list.filter(Boolean).forEach(function(id) {
        if (!game.evidence.includes(id)) {
          game.evidence.push(id);
          game.evidenceSelected = id;
          game.evidenceNoticeQueue.push(id);
          addedIds.push(id);
        }
      });
      if (addedIds.length) playSfx("evidence");
      return addedIds.length > 0;
    }

    function showSystemMessage(message) {
      game.systemMessage = message;
      render();
      if (systemMessageTimer) window.clearTimeout(systemMessageTimer);
      systemMessageTimer = window.setTimeout(function() {
        if (game.systemMessage === message) {
          game.systemMessage = "";
          render();
        }
      }, 1700);
    }

    function saveGame(showMessage) {
      try {
        const snapshot = JSON.parse(JSON.stringify(game));
        snapshot.systemMessage = "";
        localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot));
        if (showMessage) showSystemMessage("进度已保存在这台设备上");
        return true;
      } catch (error) {
        if (showMessage) showSystemMessage("保存失败，请检查浏览器存储设置");
        return false;
      }
    }

    function hasSavedGame() {
      try { return Boolean(localStorage.getItem(SAVE_KEY)); }
      catch (error) { return false; }
    }

    function continueGame() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
        if (!saved) return;
        Object.assign(game, saved);
        game.evidenceNoticeQueue = Array.isArray(game.evidenceNoticeQueue) ? game.evidenceNoticeQueue : [];
        game.evidenceSelected = game.evidence.includes(game.evidenceSelected) ? game.evidenceSelected : (game.evidence.at(-1) || null);
        game.chapterMapOpen = false;
        game.systemMessage = "";
        render();
      } catch (error) {
        showSystemMessage("存档无法读取，请从请柬重新开始");
      }
    }

    function returnToTitle() {
      saveGame(false);
      game.mode = "title";
      game.evidenceOpen = false;
      game.chapterMapOpen = false;
      render();
    }

    function sceneState() {
      return scenes[game.scene] || scenes.invitation;
    }

    function sceneInspected(key) {
      return Boolean(game.inspected[game.scene + ":" + key]);
    }

    function markInspected(key) {
      game.inspected[game.scene + ":" + key] = true;
    }

    function conversationGroups() {
      return conversations[game.scene] || {};
    }

    function talkKey(speaker, topicId) {
      return game.scene + ":" + speaker + ":" + topicId;
    }

    function topicAvailable(speaker, topic) {
      const topicRequirements = topic.requiresTopics || [];
      const evidenceRequirements = topic.requiresEvidence || [];
      const flagRequirements = topic.requiresFlags || [];
      return topicRequirements.every(function(id) { return Boolean(game.talked[talkKey(speaker, id)]); }) &&
        evidenceRequirements.every(function(id) { return game.evidence.includes(id); }) &&
        flagRequirements.every(function(id) { return Boolean(game.flags[id]); });
    }

    function availableTopics(speaker) {
      return (conversationGroups()[speaker] || []).filter(function(topic) {
        return topicAvailable(speaker, topic);
      });
    }

    function unreadTalkCount() {
      return Object.keys(conversationGroups()).reduce(function(total, speaker) {
        return total + availableTopics(speaker).filter(function(topic) {
          return !game.talked[talkKey(speaker, topic.id)];
        }).length;
      }, 0);
    }

    function openTalk(speaker) {
      const speakers = Object.keys(conversationGroups());
      if (!speakers.length) return;
      game.talkSpeaker = speakers.includes(speaker) ? speaker : (speakers.includes(game.talkSpeaker) ? game.talkSpeaker : speakers[0]);
      game.mode = "talk";
      render();
    }

    function closeTalk() {
      game.mode = "investigate";
      render();
    }

    function discussTopic(topicId) {
      const speaker = game.talkSpeaker;
      const topic = (conversationGroups()[speaker] || []).find(function(item) { return item.id === topicId; });
      if (!topic || !topicAvailable(speaker, topic)) return;
      game.talked[talkKey(speaker, topic.id)] = true;
      (topic.setFlags || []).forEach(function(flag) { game.flags[flag] = true; });
      triggerDialogue(topic.lines, "returnToTalk");
    }

    function presentationKey(evidenceId) {
      return game.scene + ":" + game.talkSpeaker + ":" + evidenceId;
    }

    function openPresentation() {
      if (!game.talkSpeaker || !game.evidence.length) return;
      game.mode = "present";
      render();
    }

    function presentEvidence(evidenceId) {
      if (!game.evidence.includes(evidenceId)) return;
      const rules = presentations[game.scene]?.[game.talkSpeaker] || {};
      const rule = rules[evidenceId];
      if (!rule) {
        playSfx("wrong");
        const item = evidenceCatalog[evidenceId] || [evidenceId, ""];
        triggerDialogue([
          ["玩家", "关于《" + item[0] + "》，你能提供新的信息吗？"],
          [game.talkSpeaker, wrongPresentationReplies[game.talkSpeaker] || "这件证物无法让我补充当前证言。"]
        ], "returnToPresent");
        return;
      }
      playSfx("unlock");
      game.presented[presentationKey(evidenceId)] = true;
      (rule.setFlags || []).forEach(function(flag) { game.flags[flag] = true; });
      triggerDialogue(rule.lines, "returnToTalk");
    }

    function setScene(id) {
      const scene = scenes[id];
      game.scene = id;
      game.mode = "dialogue";
      game.evidenceOpen = false;
      game.chapterMapOpen = false;
      game.talkSpeaker = null;
      game.dialogue = scene.intro.slice();
      game.dialogueIndex = 0;
      game.afterDialogue = scene.afterIntro;
      saveGame(false);
      render();
    }

    function startGame() {
      try { localStorage.removeItem(SAVE_KEY); } catch (error) {}
      Object.assign(game, {
        scene: "title", mode: "title", dialogue: [], dialogueIndex: 0, afterDialogue: null,
        inspected: {}, evidence: [], flags: {}, evidenceOpen: false, evidenceSelected: null,
        evidenceNoticeQueue: [], hookNumber: 0, hookText: "", hookAnswers: {}, aliasText: "", alias: "",
        deductionStep: "owner", talked: {}, talkSpeaker: null, presented: {}, chapterData: null,
        chapterMapOpen: false, systemMessage: ""
      });
      setScene("invitation");
    }

    function triggerDialogue(lines, after) {
      game.mode = "dialogue";
      game.dialogue = lines.slice();
      game.dialogueIndex = 0;
      game.afterDialogue = after || "investigate";
      playDialogueCue(lines[0]?.[1]);
      render();
    }

    function advanceDialogue() {
      if (game.dialogueIndex < game.dialogue.length - 1) {
        game.dialogueIndex += 1;
        playDialogueCue(game.dialogue[game.dialogueIndex]?.[1]);
        render();
        return;
      }
      const action = game.afterDialogue || "investigate";
      runAction(action);
    }

    function inspectObject(key) {
      const scene = sceneState();
      const object = scene.objects[key];
      if (!object) return;
      if (game.scene === "echo" && key === "recorder" && !game.flags.mirrorLightRevealed) {
        if (game.flags.recorderSeenLocked) {
          showSystemMessage("播放键仍被锁住；镜框刻线和定向烛台可能是开启方法");
          return;
        }
        game.flags.recorderSeenLocked = true;
        triggerDialogue([
          ["玩家", "播放键按不下去。不是锈住了，里面像有一块锁片故意挡着。"],
          ["拾一", "卡匣窗口下面有一小块暗红色玻璃，像老式光敏开关。普通灯光照不到这个角度。"],
          ["玩家", "所以不能直接播放。房间里应该藏着一条能把光送到这里的路线。"]
        ], "investigate");
        return;
      }
      if (sceneInspected(key)) {
        showSystemMessage("这里已经调查过了，没有新增线索");
        return;
      }
      if (game.scene === "entrance" && key === "nameCards" && !game.flags.aliasChosen) {
        game.mode = "alias";
        game.aliasText = "";
        render();
        return;
      }
      markInspected(key);
      addEvidence(object.evidence);
      triggerDialogue(object.lines, object.after || "investigate");
    }

    function submitAlias() {
      const alias = game.aliasText.trim().slice(0, 18);
      if (!alias) return;
      game.alias = alias;
      game.flags.aliasChosen = true;
      markInspected("nameCards");
      addEvidence("sealedName");
      triggerDialogue([
        ["旁白", "你在名牌正面写下今晚想使用的代号“" + alias + "”，又把真实姓名写在背面。"],
        ["门卫", "请亲手把背面封入信封。名牌正面和腕带仍会告诉别人该怎样称呼你。"],
        ["旁白", "火漆凝固。真实姓名没有消失，只是暂时由你自己保管。"]
      ], "investigate");
    }

    function exitDialogue() {
      if (game.afterDialogue === "investigate") runAction("investigate");
    }

    function openHook(number) {
      if (game.flags["hook" + number]) {
        game.mode = "investigate";
        render();
        return;
      }
      game.mode = "hook";
      game.hookNumber = number;
      game.hookText = "";
      render();
    }

    function submitHook() {
      if (!game.hookText.trim()) return;
      const n = game.hookNumber;
      game.hookAnswers[n] = game.hookText.trim();
      game.flags["hook" + n] = true;
      if (n === 1) {
        addEvidence(["freedomCard", "echoKey", "echoRecording"]);
        triggerDialogue([
          ["拾一", "答案没有被评判。它只是被记住了。"],
          ["旁白", "你的回答凝成一张自由记忆卡。与此同时，卡片边缘溢出的光另行凝成一把蜡烛形钥匙。"],
          ["玩家", "卡片和钥匙都在。是两样东西。"],
          ["未知声音", "以前属于我的下午，常常用来修理会发出声音的东西。尤其是一台旧收音机。"],
          ["旁白", "录音末尾有十七秒空白。空白中传来轻微哼唱，以及钥匙互相碰撞的声音。"],
          ["玩家", "录音创建于三年前。哼唱者和收藏室里的收音机，可能属于同一个人。"]
        ], "investigate");
      } else if (n === 2) {
        addEvidence(["collectionCard", "collectionKey"]);
        triggerDialogue([
          ["拾一", "你舍不得的东西成为第二张记忆卡。卡片旁边，出现了一把玻璃罐形状的钥匙。"],
          ["玩家", "钥匙有了，但抽屉不会自己打开。得把它插进玻璃罐形锁孔，再亲手转动。"]
        ], "collectionUnlock");
      } else if (n === 3) {
        addEvidence(["imaginaryCard", "doorKey"]);
        triggerDialogue([
          ["拾一", "你的答案没有被改写。登记簿只是为那位访客留出了一行。"],
          ["旁白", "墨迹沿着纸页边缘汇成一张门形记忆卡，又折成一把蓝色钥匙。"],
          ["玩家", "登记簿末页写着：我不是想成为他们，我只是借他们的勇气，看清自己的轮廓。"],
          ["狐狸面具客", "这句话我见过。三年前，修道具的人把它写在Cosplay服装的内衬里。"],
          ["拾一", "先完成纽扣与服装的比对。只有尺寸和针脚都吻合，这条证词才站得住。"]
        ], "investigate");
      } else if (n === 4) {
        addEvidence(["cookingPhoto", "travelTicket", "tableCard", "kitchenKey"]);
        triggerDialogue([
          ["拾一", "你愿意分享的那顿饭或那段旅程，成为第四张餐桌记忆卡。"],
          ["旁白", "卡片嵌入锁面。行李箱打开，里面没有贵重物品，只有一张做菜照片和一张从未使用的海边车票。"],
          ["玩家", "照片只拍到一双沾着面粉的手。背面写着：别忘记自己喜欢的味道。"],
          ["管理员", "旅行票的同行人一栏是空的。也许失主不是没有想带的人，只是当时不敢写下。"],
          ["拾一", "现在，把菜谱卡、入住登记和收音机维修标签放在一起比对笔迹。"]
        ], "investigate");
      }
    }

    function repairRadio() {
      if (game.flags.repaired) return;
      game.flags.repaired = true;
      game.evidenceOpen = false;
      addEvidence("repairedRadio");
      triggerDialogue([
        ["旁白", "你用钝化小刀拧开后盖，将金属细针装进缺失的连杆位置。"],
        ["旁白", "调频指针重新移动。收音机发出沙沙声，随后播放出一段短旋律。"],
        ["管理员", "……"],
        ["拾一", "管理员刚才是不是在旋律停止以后，哼出了最后一个音？"],
        ["玩家", "先别下结论。我们需要把它与回音阁录音进行直接对照。"]
      ], "investigate");
    }

    function revealMirrorLight() {
      if (game.flags.mirrorLightRevealed) return;
      game.flags.mirrorLightRevealed = true;
      game.evidenceOpen = false;
      addEvidence("mirrorLightPath");
      triggerDialogue([
        ["旁白", "你按照底座下的镜位图，把烛台放到中央镜框的四角星前，再转动遮光罩，让窄缝对准一号镜。"],
        ["拾一", "一号镜把窄光送到二号镜。二号镜框的刻线又指向三号镜……顺序和底座上的镜位图完全一致。"],
        ["旁白", "光经过九次反射，最后聚成一个很小的亮点，落在录音机卡匣下方的暗红色玻璃上。"],
        ["旁白", "录音机内部传来一声轻响。磁带计数器从“000”跳成“017”，挡住播放键的锁片缩了回去。"],
        ["玩家", "明白了。九面镜不是用来照人，而是一把不能被随手拿走的光路钥匙。现在可以播放录音了。"]
      ], "investigate");
    }

    function openCollectionDrawer() {
      if (game.flags.collectionDrawerOpened) return;
      game.flags.collectionDrawerOpened = true;
      playSfx("unlock");
      addEvidence("repairLabel");
      triggerDialogue([
        ["旁白", "你把玻璃罐形钥匙插入锁孔。钥匙转过半圈，罐口形的锁片一层层缩回。"],
        ["旁白", "咔哒。隐藏抽屉向外弹开，里面是一张从收音机底部脱落的维修标签。"],
        ["玩家", "维修人栏只剩一个“林”字，旁边同样画着四角星；但这还不能证明失主姓林。"],
        ["拾一", "制作请柬、修补镜子和维修收音机的人，留下了相同的个人标记。"]
      ], "investigate");
    }

    function compareMelody() {
      if (game.flags.melodyMatched) return;
      game.flags.melodyMatched = true;
      game.evidenceOpen = false;
      addEvidence("sameMelody");
      triggerDialogue([
        ["旁白", "你先播放回音阁的十七秒录音，再播放修复后的收音机。"],
        ["拾一", "音符顺序、停顿位置和最后缺失的一拍完全一致。"],
        ["玩家", "录音里哼唱的人，非常熟悉这台收音机。"],
        ["管理员", "这只能证明录音者听过它，不能证明身份。"],
        ["玩家", "没错。但至少四个房间并不是毫无关系的随机陈列。"]
      ], "investigate");
    }

    function matchCostume() {
      if (game.flags.costumeMatched) return;
      game.flags.costumeMatched = true;
      game.evidenceOpen = false;
      addEvidence("costumeMatch");
      triggerDialogue([
        ["旁白", "你把收藏室里的黑色星形纽扣放到服装肩部缺口旁。"],
        ["玩家", "线孔间距、残留黑线和纽扣边缘的磨损方向全部吻合。"],
        ["狐狸面具客", "异议不了。它确实从这件衣服上脱落。"],
        ["拾一", "收藏室与任意屋由一件真实物品连接起来了。修收音机和修服装的人，很可能是同一个人。"]
      ], "investigate");
    }

    function compareHandwriting() {
      if (game.flags.handwritingMatched) return;
      game.flags.handwritingMatched = true;
      game.evidenceOpen = false;
      addEvidence("handwritingMatch");
      triggerDialogue([
        ["旁白", "你并排放下维修标签、任意屋入住登记和手写菜谱卡。"],
        ["玩家", "三处文字的收笔都向右上方挑，四角星也先画竖线、再补横线。"],
        ["管理员", "可以确认是同一只手。但“林”只是残留的一个姓，还不能证明那个人就在这里。"],
        ["拾一", "没错。物证串起了房间，真正指向失主的，是四道锁选择回应了谁。"]
      ], "investigate");
    }

    function openDeduction(step) {
      game.deductionStep = step;
      game.mode = "deduction";
      render();
    }

    function wrongDeduction(lines, returnStep) {
      triggerDialogue(lines, returnStep);
    }

    function runAction(action) {
      if (action === "investigate") {
        game.mode = "investigate";
        render();
      } else if (action === "returnToTalk") {
        openTalk(game.talkSpeaker);
      } else if (action === "returnToPresent") {
        openPresentation();
      } else if (action === "awaitInvitationOpen") {
        game.mode = "invitationOpen";
        render();
      } else if (action === "openInvitation") {
        addEvidence("invitation");
        triggerDialogue([
          ["旁白", "你用拇指压住四角星火漆。细小的裂纹从中央散开，信封终于被打开。"],
          ["旁白", "烫金文字写着：今夜，礼堂里没有姓名、没有身份，只有面具之下的你。"],

      } else if (action === "acceptInvitation") {

          ["旁白", "参加，意味着把真实姓名暂时交出去，也意味着可能看到一段本不该记得的过去。"],
          ["玩家", "但如果不去，我大概会整晚想着门后究竟有什么。"],
          ["旁白", "你换好礼服，把请柬放进口袋，向旧礼堂赶去。反复确认地址耽误了时间；抵达时，登记桌前已经没有其他客人。"]
        ], "goEntrance");
      } else if (action === "declineInvitation") {
        try { localStorage.removeItem(SAVE_KEY); } catch (error) {}
        game.mode = "declined";
        render();
      } else if (action === "collectionUnlock") {
        game.mode = "collectionUnlock";
        render();
      } else if (action === "turnCollectionKey") {
        openCollectionDrawer();
      } else if (action === "goEntrance") {
        setScene("entrance");
      } else if (action === "goBallroom") {
        setScene("ballroom");
      } else if (action === "hook1") {
        openHook(1);
      } else if (action === "hook2") {
        openHook(2);
      } else if (action === "hook3") {
        openHook(3);
      } else if (action === "hook4") {
        openHook(4);
      } else if (action === "chapter1Complete") {
