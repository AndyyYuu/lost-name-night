      } else if (action === "chapter2Complete") {
        showChapter(2);
      } else if (action === "foxReveal") {
        triggerDialogue([
          ["旁白", "修复后的收音机再次响起。门外的狐狸面具客突然推门进来。"],
          ["狐狸面具客", "把它关掉。"],
          ["玩家", "你认识这台收音机？"],
          ["狐狸面具客", "它以前总出现在我们的后台录像里。负责修道具的人不喜欢出镜。"],
          ["玩家", "那个人叫什么？"],
          ["狐狸面具客", "我不能确定。但这枚黑色星形纽扣……来自一套我曾经穿过的Cosplay服装。"],
          ["狐狸面具客", "如果你一定要继续，就去任意屋找那套衣服。那里还有一张后台合照：修理道具的人没有入镜，只在画面边缘留下了一只正在缝纽扣的手。"],
          ["拾一", "第三扇门的图案亮了。我们找到的不是名字，而是一条通往名字的路。"]
        ], "chapter3Complete");
      } else if (action === "chapter3Complete") {
        showChapter(3);
      } else if (action === "chapter4Complete") {
        showChapter(4);
      } else if (action === "chapter5Complete") {
        showChapter(5);
      } else if (action === "identityChoice") {
        openDeduction("owner");
      } else if (action === "accuseAdministrator") {
        wrongDeduction([
          ["玩家", "异议！失主是管理员。录音里有钥匙声，他也会哼那段旋律。"],
          ["影子", "钥匙属于职位，旋律可以被听见。你证明了他接触过线索，却没有证明四道锁为何回应你。"],
          ["拾一", "推理还缺少决定性的一步。再想想，谁亲自生成了四张记忆卡？"]
        ], "identityChoice");
      } else if (action === "accuseFox") {
        wrongDeduction([
          ["玩家", "异议！失主是狐狸面具客。他认识服装，也认得收音机。"],
          ["狐狸面具客", "我在照片里，也在那些回忆旁边。但认识一个人的物品，不等于拥有那个人的记忆。"],
          ["拾一", "证人知道得多，所以可疑；但“可疑”不是身份。再检查共鸣锁的共同条件。"]
        ], "identityChoice");
      } else if (action === "accusePlayer") {
        triggerDialogue([
          ["玩家", "我的暂定结论是：失主是我。接下来，我会用证物证明。"],
          ["影子", "只因为你碰巧回答了四个问题？这不是证据，只是自我感动。"],
          ["拾一", "那就提交能解释四道锁、封存姓名和无名面具的决定性证物。"]
        ], "identityProof");
      } else if (action === "identityProof") {
        openDeduction("proof");
      } else if (action === "proveLabel") {
        wrongDeduction([
          ["玩家", "决定性证物是收音机维修标签。上面残留了姓氏“林”。"],
          ["影子", "它只能说明维修者可能姓林。你甚至没有证明失主一定等于维修者。"],
          ["拾一", "标签连接了物品，却没有解释为什么失主的面具会等待今晚最后一个签名的人。"]
        ], "identityProof");
      } else if (action === "proveMelody") {
        wrongDeduction([
          ["玩家", "决定性证物是相同旋律。失主熟悉收音机。"],
          ["影子", "熟悉旋律的人不止一个。狐狸客听过，管理员也能哼。"],
          ["拾一", "旋律证明房间相连，不足以从所有人中只指向一个。"]
        ], "identityProof");
      } else if (action === "proveMemories") {
        triggerDialogue([
          ["玩家", "决定性证物是四张记忆卡，以及入口处封存的姓名。"],
          ["玩家", "每道锁的问题都不同，却只在我说出真实经历后开启。它们保存的不是标准答案，而是失主愿意承认的选择。"],
          ["拾一", "无名面具内侧缺少的，正是四张卡拼成的那一部分。入口信封又保存着同一个人的名字。"],
          ["影子", "……如果承认了，明天别人仍可能看不懂你。"],
          ["玩家", "但我至少不会再替他们先把自己忘掉。"],
          ["旁白", "黑色面具上的四角星逐一点亮。面具守门人侧身让开，完好无损的面具后方，是通往礼堂的路。"]
        ], "chapter6Complete");
      } else if (action === "chapter6Complete") {
        showChapter(6);
      } else if (action === "revealOwner") {
        addEvidence("namedMask");
        triggerDialogue([
          ["旁白", "完整的卡片面具与黑色无名面具重叠，内侧那块浅色空缺被严丝合缝地填满。"],
          ["主持人", "证据成立。失主不是管理员，不是狐狸面具客，也不是三年前某个只留下姓氏的人。"],
          ["主持人", "失主是今晚亲手封存姓名、又亲手取回四段记忆的你。"],
          ["玩家", "所以我不是在替陌生人找名字，而是在证明名字下面还有什么。"],
          ["拾一", "现在可以要求主持人把姓名归还了。"]
        ], "chapter7Complete");
      } else if (action === "chapter7Complete") {
        showChapter(7);
      } else if (action === "goEpilogue") {
        setScene("epilogue");
      } else if (action === "ending") {
        game.mode = "ending";
        render();
      } else if (action === "nextChapter") {
        const nextScenes = {
          1: "echo",
          2: "collection",
          3: "anyHouse",
          4: "kitchen",
          5: "shadow",
          6: "assembly",
          7: "finale"
        };
        if (nextScenes[game.chapterData]) setScene(nextScenes[game.chapterData]);
      } else if (action === "restart") {
        try { localStorage.removeItem(SAVE_KEY); } catch (error) {}
        game.scene = "title";
        game.mode = "title";
        game.dialogue = [];
        game.dialogueIndex = 0;
        game.afterDialogue = null;
        game.inspected = {};
        game.evidence = [];
        game.flags = {};
        game.evidenceOpen = false;
        game.evidenceSelected = null;
        game.evidenceNoticeQueue = [];
        game.hookNumber = 0;
        game.hookText = "";
        game.hookAnswers = {};
        game.aliasText = "";
        game.alias = "";
        game.deductionStep = "owner";
        game.talked = {};
        game.talkSpeaker = null;
        game.presented = {};
        game.chapterData = null;
        game.chapterMapOpen = false;
        game.systemMessage = "";
        render();
      }
    }

    function showChapter(number) {
      playSfx("unlock");
      game.chapterData = number;
      game.mode = "chapter";
      saveGame(false);
      render();
    }

    function isSceneComplete() {
      const scene = sceneState();
      if (!scene.required) return false;
      const inspected = scene.required.every(function(key) { return sceneInspected(key); });
      if (!inspected) return false;
      if (game.scene === "entrance") return Boolean(game.flags.entranceTalkCleared);
      if (game.scene === "ballroom") return Boolean(game.flags.ballroomHostCleared && game.flags.ballroomFoxCleared);
      if (game.scene === "echo") return Boolean(game.flags.hook1 && game.flags.mirrorLightRevealed && game.flags.echoTalkCleared);
      if (game.scene === "collection") {
        return Boolean(game.flags.hook2 && game.flags.collectionDrawerOpened && game.flags.repaired && game.flags.melodyMatched && game.flags.collectionLabelCleared && game.flags.collectionTalkCleared);
      }
      if (game.scene === "anyHouse") return Boolean(game.flags.hook3 && game.flags.costumeMatched && game.flags.anyHouseLedgerCleared && game.flags.anyHouseFoxCleared);
      if (game.scene === "kitchen") return Boolean(game.flags.hook4 && game.flags.handwritingMatched && game.flags.kitchenAdminCleared && game.flags.kitchenShiyiCleared);
      if (game.scene === "assembly") return Boolean(game.flags.assemblyTalkCleared);
      return true;
    }

    function progressionHint() {
      const scene = sceneState();
      if (game.scene === "echo" && game.evidence.includes("mirrorMark") && game.evidence.includes("candle") && !game.flags.mirrorLightRevealed) {
        return "关联线索 · 根据烛台底座的镜位图，从四角星起点重建九面镜光路";
      }
      const pendingObjects = (scene.required || Object.keys(scene.objects || {})).filter(function(key) { return !sceneInspected(key); });
      if (pendingObjects.length) return "调查模式 · 移动放大镜，调查黄色区域（还剩 " + pendingObjects.length + " 处）";
      if (game.scene === "collection" && !game.flags.repaired) return "关联线索 · 打开证物栏，用钝化小刀与金属细针修复旧收音机";
      if (game.scene === "collection" && !game.flags.melodyMatched) return "关联线索 · 在证物栏对比修复后的收音机与十七秒录音";
      if (game.scene === "anyHouse" && !game.flags.costumeMatched) return "关联线索 · 在证物栏对比四角星纽扣与黑色服装";
      if (game.scene === "kitchen" && !game.flags.handwritingMatched) return "关联线索 · 在证物栏对比维修标签、入住登记与手写菜谱";
      const hints = {
        entrance: "线索不足 · 与门卫交谈，并把无名面具出示给他",
        ballroom: "继续问话 · 分别向主持人与狐狸面具客出示相关证物",
        echo: "光路已经开启录音机 · 向管理员出示十七秒录音，追问钥匙的声音",
        collection: "关联证物成立 · 向管理员出示维修标签与旋律对照",
        anyHouse: "两个证人都在隐瞒 · 分别出示入住登记与服装比对",
        kitchen: "身份链只差口供 · 向管理员和拾一出示照片、车票与笔迹",
        assembly: "最后的质询 · 向主持人出示四张记忆卡"
      };
      return hints[game.scene] || "调查完成 · 检查交谈与证物栏，推进案件";
    }

    function conversationStepReady() {
      const scene = sceneState();
      const objectsDone = (scene.required || []).every(function(key) { return sceneInspected(key); });
      if (!objectsDone || isSceneComplete()) return false;
      if (game.scene === "echo") return Boolean(game.flags.hook1);
      if (game.scene === "collection") return Boolean(game.flags.repaired && game.flags.melodyMatched);
      if (game.scene === "anyHouse") return Boolean(game.flags.costumeMatched);
      if (game.scene === "kitchen") return Boolean(game.flags.handwritingMatched);
      return ["entrance", "ballroom", "assembly"].includes(game.scene);
    }

    function chapterTitle() {
      const c = sceneState().chapter;
      return {
        0: "第〇夜",
        1: "第一章",
        2: "第二章",
        3: "第三章",
        4: "第四章",
        5: "第五章",
        6: "第六章",
        7: "第七章",
        8: "终幕"
      }[c] || "失名之夜";
    }

    function chapterSteps() {
      const currentChapter = sceneState().chapter || 1;
      const names = ["最后一个签名的人", "镜中的十七秒", "不会唱完的收音机", "不存在的访客", "没有人入镜的晚餐", "不愿被找回的人", "四张卡拼成的面具"];
      return names.map(function(name, i) {
        const n = i + 1;
        const cls = n < currentChapter ? "done" : n === currentChapter ? "active" : "";
        return '<div class="chapter-step ' + cls + '"><span class="step-index">' + n + '</span><span>' + name + '</span></div>';
      }).join("");
    }

    function evidenceCountForScene() {
      const scene = sceneState();
      const visibleObjects = Object.keys(scene.objects || {});
      const total = visibleObjects.length;
      const done = visibleObjects.filter(sceneInspected).length;
      return [done, total];
    }

    function poseIndexFor(speaker, text) {
      if (speaker === "拾一") {
        if (text.includes("面具内部") || text.includes("敲击声")) return 0;
        if (text.includes("疼疼疼")) return 1;
        if (text.includes("？") || text.includes("先") || text.includes("需要")) return 2;
        if (text.includes("不是") || text.includes("突然") || text.includes("亮了")) return 3;
        return 1 + (game.dialogueIndex % 3);
      }
      if (text.includes("？")) return 1;
      if (text.includes("不知道") || text.includes("不能") || text.includes("别") || text.includes("关闭")) return 3;
      if (text.includes("信") || text.includes("请柬") || text.includes("名字") || text.includes("名牌")) return (2 + game.dialogueIndex) % 4;
      const seed = Array.from(text).reduce(function(sum, char) { return sum + char.charCodeAt(0); }, 0);
      return (seed + game.dialogueIndex + speaker.length) % 4;
    }

    function renderPortrait(speaker, text) {
      const art = speaker === "拾一" ? assets.shiyi : speakerArt[speaker];
      if (!art) return '<div class="portrait sprite"><span class="sprite-mark">✦</span></div>';
      const pose = poseIndexFor(speaker, text);
      const x = (pose * 100 / 3).toFixed(3);
      const cls = speaker === "拾一" ? "portrait shiyi-portrait" : "portrait";
      return '<div class="' + cls + '" data-pose="' + pose + '" style="background-image:url(' + art + ');background-position-x:' + x + '%"></div>';
    }

    function speakerSlug(speaker) {
      return {
        "门卫": "gatekeeper",
        "狐狸面具客": "fox",
        "管理员": "administrator",
        "主持人": "host",
        "影子": "shadow",
        "拾一": "shiyi"
      }[speaker] || "none";
    }

    function renderStageSpeaker() {
      if (game.mode !== "dialogue") return "";
      const line = game.dialogue[game.dialogueIndex] || ["", ""];
      const speaker = line[0];
      const text = line[1];
      const art = speaker === "拾一" ? assets.shiyi : speakerArt[speaker];
      if (!art) return "";
      if (speaker === "拾一" && game.scene === "ballroom" && text.includes("疼疼疼")) return "";
      const pose = poseIndexFor(speaker, text);
      const x = (pose * 100 / 3).toFixed(3);
      const blinkDelay = (.25 + ((text.length + pose) % 8) * .06).toFixed(2);
      return '<div class="stage-speaker speaker-' + speakerSlug(speaker) + '" data-pose="' + pose + '" style="background-image:url(' + art + ');--sprite-x:' + x + '%;--blink-delay:' + blinkDelay + 's">' +
        '<span class="blink-pair" aria-hidden="true"><i></i><i></i></span>' +
      '</div>';
    }

    function formatDialogue(text) {
      let formatted = text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
      const keywords = [
        "最后一个完成姓名登记的人", "最后一个签名的人", "今晚没有人会用真名", "三处笔迹一致",
        "四张记忆卡", "决定性证物", "黑色星形纽扣", "十七秒录音", "无名面具",
        "姓名归还", "原样归还", "入住登记", "维修标签", "做菜照片", "相同旋律",
        "失主是我", "证据成立", "完全一致", "日出以前", "都会消失", "钥匙声",
        "共鸣锁", "四角星", "Cosplay", "异议", "失主", "真名", "名字", "姓名", "姓氏", "林"
      ].sort(function(a, b) { return b.length - a.length; });
      const escapedKeywords = keywords.map(function(word) {
        return word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      });
      return formatted.replace(new RegExp("(" + escapedKeywords.join("|") + ")", "g"), '<em class="dialogue-keyword">$1</em>');
    }

    function emotionClass() {
      if (game.mode !== "dialogue") return "";
      const text = (game.dialogue[game.dialogueIndex] || ["", ""])[1];
      if (/剧烈震动|疼疼疼|把它关掉|都会消失|完全一致|图案亮了|无法否认|异议|失主是我|裂开|证据成立/.test(text)) return " emotion-strong";
      if (/突然|忘记了自己的名字|你是谁|不能确定|不属于普通客人|最后一个音|挡住去路|决定性证物|归还/.test(text)) return " emotion-hit";
      return "";
    }

    function renderShiyiEntrance() {
      if (game.mode !== "dialogue" || game.scene !== "ballroom") return "";
      const line = game.dialogue[game.dialogueIndex] || ["", ""];
      return line[0] === "拾一" && line[1].includes("疼疼疼")
        ? '<div class="shiyi-emergence" aria-hidden="true"></div>'
        : "";
    }

    function renderDialogue() {
      if (game.mode !== "dialogue") return "";
      const line = game.dialogue[game.dialogueIndex] || ["旁白", ""];
      const exitButton = game.afterDialogue === "investigate"
        ? '<button class="dialogue-exit-button" data-action="exit-dialogue">返回调查</button>'
        : "";
      return '<section class="dialogue-wrap" aria-live="polite">' +
        '<div class="dialogue-copy">' +
          '<div class="speaker-row"><span class="speaker-name">' + line[0] + '</span><span class="speaker-line"></span></div>' +
          '<p class="dialogue-text">' + formatDialogue(line[1]) + '</p>' +
        '</div>' +
        '<div class="dialogue-actions">' +
          '<span class="dialogue-counter">' + (game.dialogueIndex + 1) + ' / ' + game.dialogue.length + '</span>' +
          exitButton +
          '<button class="advance-button" data-action="advance">继续</button>' +
        '</div>' +
      '</section>';
    }

    function renderTalkButton() {
      const speakers = Object.keys(conversationGroups());
      if (game.mode !== "investigate" || !speakers.length) return "";
      const unread = unreadTalkCount();
      const label = speakers.length === 1 ? "与" + speakers[0] + "交谈" : "交谈";
      return '<button class="talk-button' + (conversationStepReady() ? ' is-required' : '') + '" data-action="open-talk" aria-label="' + label + '">' +
        '<span class="talk-icon" aria-hidden="true"></span>' +
        '<span>' + label + '</span>' +
        '<span class="talk-count" aria-label="' + unread + '个未谈话题">' + unread + '</span>' +
      '</button>';
    }

    function renderProgressionTip() {
      if (game.mode !== "investigate") return "";
      const hint = progressionHint();
      if (conversationStepReady()) {
        return '<button class="investigate-tip is-action" data-action="open-talk">关键调查完成 · 可继续问话，也可以检查剩余区域<strong>点击交谈 ›</strong></button>';
      }
      return '<div class="investigate-tip">' + hint + '</div>';
    }

    function renderTalkMenu() {
      if (game.mode !== "talk") return "";
      const groups = conversationGroups();
      const speakers = Object.keys(groups);
      const speaker = speakers.includes(game.talkSpeaker) ? game.talkSpeaker : speakers[0];
      const topics = availableTopics(speaker);
      const tabs = speakers.length > 1
        ? '<div class="talk-speakers" role="tablist" aria-label="选择交谈对象">' + speakers.map(function(name) {
            return '<button class="talk-speaker-tab' + (name === speaker ? ' active' : '') + '" data-action="select-talk-speaker" data-speaker="' + name + '" role="tab" aria-selected="' + (name === speaker) + '">' + name + '</button>';
          }).join('') + '</div>'
        : '';
      const rows = topics.map(function(topic, index) {
        const read = Boolean(game.talked[talkKey(speaker, topic.id)]);
        const unlocked = !read && Boolean((topic.requiresTopics || []).length || (topic.requiresEvidence || []).length || (topic.requiresFlags || []).length);
        return '<button class="talk-topic' + (read ? ' is-read' : '') + (unlocked ? ' is-new' : '') + '" style="--topic-index:' + index + '" data-action="talk-topic" data-topic="' + topic.id + '">' +
          '<span class="topic-state" aria-hidden="true">✓</span>' +
          '<span class="topic-label">' + topic.label + '</span>' +
          (unlocked ? '<span class="topic-new">NEW</span>' : '<span></span>') +
        '</button>';
      }).join('');
      return '<div class="talk-overlay">' +
        '<section class="talk-menu" aria-label="交谈话题">' +
          '<div class="talk-menu-heading">与' + speaker + '交谈</div>' +
          tabs +
          '<div class="talk-topic-list">' + rows + '</div>' +
          '<div class="talk-menu-footer"><span>证词会随着追问与出示证物不断更新；带 NEW 的话题可以推进案件。</span><div class="talk-footer-actions"><button class="present-button" data-action="open-presentation">出示证物</button><button class="talk-close" data-action="close-talk">返回调查</button></div></div>' +
        '</section>' +
      '</div>';
    }

    function renderPresentationMenu() {
      if (game.mode !== "present") return "";
      const speaker = game.talkSpeaker;
      const cards = game.evidence.slice().reverse().map(function(id, index) {
        const item = evidenceCatalog[id] || [id, ""];
        const shown = Boolean(game.presented[presentationKey(id)]);
        return '<button class="present-evidence' + (shown ? ' is-presented' : '') + '" style="--present-index:' + index + '" data-action="present-evidence" data-evidence="' + id + '">' +
          evidenceIcon(id) +
          '<strong>' + item[0] + '</strong>' +
          (shown ? '<span>已出示</span>' : '') +
        '</button>';
      }).join("");
      return '<div class="presentation-overlay">' +
        '<section class="presentation-menu" aria-label="向' + speaker + '出示证物">' +
          '<header class="presentation-header"><strong>向' + speaker + '出示</strong><span>选择能直接击中当前矛盾的证物</span></header>' +
          '<div class="presentation-grid">' + cards + '</div>' +
          '<footer class="presentation-footer"><span>出示错误不会中断案件；对方会说明它为何不能支持推理。</span><button class="talk-close" data-action="close-presentation">返回交谈</button></footer>' +
        '</section>' +
      '</div>';
    }

    function renderInvestigationCursor() {
      return game.mode === "investigate"
        ? '<div class="investigation-cursor" aria-hidden="true"><span></span></div>'
        : "";
    }

    function renderHotspots() {
      if (game.mode !== "investigate") return "";
      const objects = sceneState().objects || {};
      return Object.keys(objects).map(function(key) {
        const object = objects[key];
        const inspected = sceneInspected(key) ? " inspected" : "";
        const region = investigationRegions[game.scene + ":" + key] || [14, 18];
        return '<button class="hotspot' + inspected + '" style="--x:' + object.x + '%;--y:' + object.y + '%;--hit-w:' + region[0] + '%;--hit-h:' + region[1] + '%" data-object="' + key + '" data-label="' + object.label + '" aria-label="调查' + object.label + '">' +
          '<span class="hotspot-label">' + object.label + '</span>' +
        '</button>';
      }).join("");
    }

    function renderEvidenceCards(compact) {
      if (!game.evidence.length) {
        return compact ? '<div class="evidence-empty">用放大镜调查场景，证物会自动收进这里。</div>' : '<div class="empty-evidence">调查场景中的放大镜热点，证物会自动记录在这里。</div>';
      }
      return game.evidence.map(function(id, index) {
        const item = evidenceCatalog[id] || [id, ""];
        const icon = evidenceIcon(id);
        if (compact) {
          return '<div class="evidence-entry' + (index === game.evidence.length - 1 ? ' is-new' : '') + '">' + icon + '<div><strong>' + item[0] + '</strong><span>' + item[1] + '</span></div></div>';
        }
        return '<article class="evidence-card">' + icon + '<strong>' + item[0] + '</strong><p>' + item[1] + '</p></article>';
      }).join("");
    }

    function evidenceIcon(id, extraClass) {
      const className = "evidence-icon" + (extraClass ? " " + extraClass : "");
      const visual = evidenceVisuals[id];
      if (visual) {
        return '<div class="' + className + '" role="img" aria-label="' + (evidenceCatalog[id]?.[0] || id) + '图片" style="background-image:url(' + visual[0] + ');background-position:' + visual[1] + ';background-size:' + visual[2] + '"></div>';
      }
      const index = evidenceAtlasIndex[id] ?? 19;
      const col = index % 5;
      const row = Math.floor(index / 5);
      const x = (col * 25).toFixed(3);
      const y = (row * 100 / 3).toFixed(3);
      return '<div class="' + className + '" role="img" aria-label="' + (evidenceCatalog[id]?.[0] || id) + '图片" style="background-image:url(' + assets.evidenceAtlas + ');background-position:' + x + '% ' + y + '%"></div>';
    }

    function renderAssociations() {
      const canRevealMirror = game.evidence.includes("mirrorMark") &&
        game.evidence.includes("candle") &&
        !game.flags.mirrorLightRevealed;
      const canRepair = game.evidence.includes("brokenRadio") &&
        game.evidence.includes("tapedKnife") &&
        game.evidence.includes("metalPin") &&
        !game.flags.repaired;
      const canCompare = game.flags.repaired &&
        game.evidence.includes("echoRecording") &&
        !game.flags.melodyMatched;
      const canMatchCostume = game.evidence.includes("starButton") &&
        game.evidence.includes("cosplayCostume") &&
        !game.flags.costumeMatched;
      const canCompareHandwriting = game.evidence.includes("repairLabel") &&
        game.evidence.includes("visitorLedger") &&
        game.evidence.includes("recipeCard") &&
        !game.flags.handwritingMatched;
      if (!canRevealMirror && !canRepair && !canCompare && !canMatchCostume && !canCompareHandwriting) {
        return '<div class="association-zone"><h3>线索对照</h3><p>取得能够互相解释的证物后，这里会出现新的推理操作。</p></div>';
      }
      return '<div class="association-zone"><h3>发现可以尝试的关联</h3><p>关联不会凭空合成物品，而是执行明确的检查或对照操作。</p>' +
        (canRevealMirror ? '<button class="association-button" data-action="reveal-mirror-light">将烛台放到四角星起点，根据底座的一至九号镜位图重建光路</button>' : '') +
        (canRepair ? '<button class="association-button" data-action="repair-radio">用小刀打开后盖，并以金属细针替代缺失连杆销</button>' : '') +
        (canCompare ? '<button class="association-button" data-action="compare-melody">依次播放收音机与十七秒录音，对照旋律</button>' : '') +
        (canMatchCostume ? '<button class="association-button" data-action="match-costume">把黑色星形纽扣放入Cosplay服装肩部缺口，比对线孔与磨损</button>' : '') +
        (canCompareHandwriting ? '<button class="association-button" data-action="compare-handwriting">并排检查维修标签、入住登记与菜谱卡的笔迹</button>' : '') +
      '</div>';
    }

    function renderEvidenceModal() {
      if (!game.evidenceOpen) return "";
      return '<div class="evidence-backdrop">' +
        '<section class="evidence-book">' +
          '<header class="book-header"><div><small>COURT RECORD</small><h2>证物记录</h2></div><button class="close-button" data-action="toggle-evidence" aria-label="关闭">×</button></header>' +
          '<div class="evidence-grid">' + renderEvidenceCards(false) + '</div>' +
          renderAssociations() +
        '</section>' +
      '</div>';
    }

    function selectedEvidenceId() {
      if (game.evidence.includes(game.evidenceSelected)) return game.evidenceSelected;
      return game.evidence.at(-1) || null;
    }

    function recordDescription(description) {
      const parts = (description.match(/[^。！？；]+[。！？；]?/g) || [description]).filter(Boolean).slice(0, 4);
      while (parts.length < 3) parts.push("　");
      return parts.map(function(part) { return '<span>' + formatDialogue(part) + '</span>'; }).join("");
    }

    function renderCourtRecord() {
      if (!game.evidenceOpen) return "";
      const selected = selectedEvidenceId();
      const item = selected ? (evidenceCatalog[selected] || [selected, ""]) : ["尚无证物", "调查场景后，证物会记录在这里。"];
      const thumbnails = game.evidence.map(function(id, index) {
        const evidence = evidenceCatalog[id] || [id, ""];
        return '<button class="evidence-entry record-thumbnail' + (id === selected ? ' is-selected' : '') + (index === game.evidence.length - 1 ? ' is-new' : '') + '" data-action="select-evidence" data-evidence="' + id + '" aria-label="查看' + evidence[0] + '">' +
          evidenceIcon(id) + '<strong>' + evidence[0] + '</strong>' +
        '</button>';
      }).join("");
      return '<div class="court-record-backdrop" role="presentation">' +
        '<section class="court-record" role="dialog" aria-modal="true" aria-label="证物簿">' +
          '<header class="record-header"><div><small>COURT RECORD</small><strong>证物簿</strong></div><button class="record-close" data-action="toggle-evidence">返回调查</button></header>' +
          '<div class="record-main">' +
            '<div class="record-large-frame">' + (selected ? evidenceIcon(selected, "record-large-icon") : '') + '</div>' +
            '<div class="record-copy"><h2>' + item[0] + '</h2><div class="record-description">' + recordDescription(item[1]) + '</div>' + renderAssociations() + '</div>' +
          '</div>' +
          '<div class="record-strip-shell"><div class="record-strip-label"><span>证物一览</span><span>' + game.evidence.length + ' 件 · 点击缩略图查看</span></div><div class="record-strip">' + (thumbnails || '<div class="evidence-empty">尚未取得证物</div>') + '</div></div>' +
        '</section>' +
      '</div>';
    }

    function renderEvidenceAcquisition() {
      const id = game.evidenceNoticeQueue[0];
      if (!id) return "";
      const item = evidenceCatalog[id] || [id, ""];
      const remaining = game.evidenceNoticeQueue.length - 1;
      return '<div class="evidence-acquired-overlay" role="dialog" aria-modal="true" aria-label="取得证物">' +
        '<section class="evidence-acquired-card">' +
          '<div class="acquired-visual">' + evidenceIcon(id, "acquired-icon") + '</div>' +
          '<div class="acquired-copy"><h2>' + item[0] + '</h2><p>' + formatDialogue(item[1]) + '</p></div>' +
        '</section>' +
        '<section class="acquired-dialogue" data-action="dismiss-evidence" aria-label="点击底部区域继续"><p>已将证物“' + item[0] + '”的资料<br>放进证物簿中。' + (remaining ? '<small>　还有 ' + remaining + ' 件待记录</small>' : '') + '<span class="acquired-dialogue-hint">点击底部任意位置，或按 Enter / 空格继续</span></p><button data-action="dismiss-evidence" aria-label="继续到下一步">继续</button></section>' +
      '</div>';
    }

    function renderEvidenceRail() {
      const open = game.evidenceOpen;
      return '<button class="evidence-tab' + (open ? '' : ' closed') + '" data-action="toggle-evidence" aria-expanded="' + open + '">' +
        (open ? '关闭证物簿' : '证物 ' + game.evidence.length) +
      '</button>' + renderCourtRecord();
    }

    function renderHook() {
      if (game.mode !== "hook") return "";
      const q = {
        1: "想象一个周末的下午：接下来的三四个小时完全属于你，没有人安排你，也没有任何“应该”。你会先去哪里、做什么？如果愿意，再写下你为什么会想到它。",
        2: "你曾经收藏过什么？它不需要值钱，也不需要有用。写下那件舍不得的东西，以及它现在可能在哪里。",
        3: "想起一位“想象中的访客”——书里的角色、游戏里的伙伴，或你曾经想成为的英雄。你脑海中第一个出现的是谁？他来自哪里？",
        4: "如果可以为一个人做一顿饭，或者带一个人去旅行，这个人会是谁？你会做什么菜，或者去哪里？"
      }[game.hookNumber];
      return '<div class="modal-backdrop">' +
        '<section class="hook-card">' +
          '<header class="hook-header"><div><small>RESONANCE LOCK</small><h2>共鸣锁 · 第' + game.hookNumber + '题</h2></div></header>' +
          '<div class="hook-body">' +
            '<p class="hook-question">' + q + '</p>' +
            '<p class="hook-note">当前原型只记录在本页面内，不会上传。答案内容不被评分，只用于生成剧情中的记忆卡。</p>' +
            '<textarea class="hook-input" data-hook-input placeholder="写下一段属于你的回答……">' + game.hookText + '</textarea>' +
            '<button class="hook-submit" data-action="submit-hook"' + (game.hookText.trim() ? '' : ' disabled') + '>提交经历，生成钥匙</button>' +
          '</div>' +
        '</section>' +
      '</div>';
    }

    function renderDeduction() {
      if (game.mode !== "deduction") return "";
      if (game.deductionStep === "proof") {
        return '<div class="modal-backdrop"><section class="deduction-card">' +
          '<small>FINAL DEDUCTION · 2 / 2</small>' +
          '<h2>哪一组证物能唯一解释“失主是我”？</h2>' +
          '<p>选择能同时解释四道共鸣锁、无名面具缺口和入口姓名封存的证物。</p>' +
          '<div class="deduction-options">' +
            '<button class="deduction-option" data-action="proveLabel"><strong>维修标签</strong><span>残留姓氏“林”，连接收音机与四角星。</span></button>' +
            '<button class="deduction-option" data-action="proveMelody"><strong>相同旋律</strong><span>证明录音者、收音机和厨房计时器存在共同习惯。</span></button>' +
            '<button class="deduction-option" data-action="proveMemories"><strong>四张记忆卡＋封存姓名</strong><span>四道锁只回应玩家的真实经历，且卡片恰好填入无名面具。</span></button>' +
          '</div>' +
        '</section></div>';
      }
      return '<div class="modal-backdrop"><section class="deduction-card">' +
        '<small>FINAL DEDUCTION · 1 / 2</small>' +
        '<h2>无名面具真正等待的人是谁？</h2>' +
        '<p>不要选择“最可疑的人”，选择能让全部线索同时成立的人。</p>' +
        '<div class="deduction-options">' +
          '<button class="deduction-option" data-action="accuseAdministrator"><strong>管理员</strong><span>携带钥匙，并对收音机旋律产生了反应。</span></button>' +
          '<button class="deduction-option" data-action="accuseFox"><strong>狐狸面具客</strong><span>认识Cosplay服装，也知道修理者长期站在镜头外。</span></button>' +
          '<button class="deduction-option" data-action="accusePlayer"><strong>玩家自己</strong><span>亲手封存姓名，也是唯一让四道共鸣锁全部开启的人。</span></button>' +
        '</div>' +
      '</section></div>';
    }

    function renderChapterModal() {
      if (game.mode !== "chapter") return "";
      const data = {
        1: ["第一章完成", "最后一个签名的人", "你接受了三年前留下的失主委托。拾一从黑色面具中醒来，四个记忆房间正式开放。", "进入第二章"],
        2: ["第二章完成", "镜中的十七秒", "烛台底座给出九面镜子的顺序，定向光路解开了录音机的光敏锁。第一张记忆卡与蜡烛形钥匙也已分别收入证物簿。", "进入第三章"],
        3: ["第三章完成", "不会唱完的收音机", "收音机旋律与回音录音一致，维修标签残留姓氏“林”。狐狸面具客又把线索指向了一套Cosplay服装。", "进入第四章"],
        4: ["第四章完成", "不存在的访客", "黑色星形纽扣与Cosplay服装的缺口完全吻合。入住登记则记录着失主借虚构人物看清自己的方式。", "进入第五章"],
        5: ["第五章完成", "没有人入镜的晚餐", "做菜照片、旅行票与三处一致笔迹补齐了四个房间。所有物品都指向一个总把自己留在镜头外的人。", "进入暗廊"],
        6: ["第六章完成", "不愿被找回的人", "你排除了“最可疑”的管理员和狐狸客，并用四张记忆卡证明：共鸣锁一直在等待亲手封存姓名的玩家。", "回到礼堂"],
        7: ["第七章完成", "四张卡拼成的面具", "烛、罐、门与餐桌填入无名面具的缺口。失主身份得到完整证明，现在只剩姓名归还与记忆交换。", "进入终幕"]
      }[game.chapterData];
      return '<div class="modal-backdrop"><section class="chapter-card">' +
        '<span class="chapter-kicker">' + data[0] + '</span>' +
        '<h2>' + data[1] + '</h2>' +
        '<p>' + data[2] + '</p>' +
        '<button data-action="next-chapter">' + data[3] + '</button>' +
      '</section></div>';
    }

    function renderAudioControls() {
      const percent = Math.round(audioState.volume * 100);
      return '<div class="audio-controls' + (audioState.muted ? ' is-muted' : '') + '" aria-label="声音设置">' +
        '<button class="sound-toggle" data-action="toggle-audio" aria-pressed="' + audioState.muted + '" aria-label="' + (audioState.muted ? '打开声音' : '关闭声音') + '">' +
          '<span class="sound-note" aria-hidden="true">♪</span><span>声音</span><span class="sound-state">' + (audioState.muted ? '关' : '开') + '</span>' +
        '</button>' +
        '<label class="volume-control"><span>音量</span><input type="range" min="0" max="1" step="0.02" value="' + audioState.volume + '" data-audio-volume aria-label="音乐与音效音量，当前' + percent + '%"></label>' +
      '</div>';
    }

    function renderSystemControls() {
      return '<nav class="system-controls" aria-label="游戏菜单">' +
        '<button class="system-button" data-action="save-game">保存</button>' +
        '<button class="system-button" data-action="toggle-chapters">章节</button>' +
        '<button class="system-button" data-action="return-title">返回标题</button>' +
      '</nav>';
    }

    function renderSystemToast() {
      return game.systemMessage ? '<div class="system-toast" role="status">' + game.systemMessage + '</div>' : "";
    }

    function renderChapterMap() {
      if (!game.chapterMapOpen) return "";
      const current = sceneState().chapter || 1;
      const items = [
        [1, "最后一个签名的人", "登记代号，封存真实姓名，并接受失主委托"],
        [2, "镜中的十七秒", "在回音阁取得录音与第一张记忆卡"],
        [3, "不会唱完的收音机", "修复旧物，建立旋律与维修标签的关联"],
        [4, "不存在的访客", "调查Cosplay服装、照片与入住登记"],
        [5, "没有人入镜的晚餐", "以菜谱、照片、车票补全跨房笔迹链"],
        [6, "不愿被找回的人", "在暗廊提出身份结论并接受反证"],
        [7, "四张卡拼成的面具", "将四张记忆卡嵌回无名面具"],
        [8, "姓名归还", "取回姓名，并决定愿意分享的记忆"]
      ].map(function(item) {
        const cls = item[0] < current ? " is-done" : item[0] === current ? " is-current" : "";
        return '<div class="chapter-map-item' + cls + '"><span class="chapter-map-index">' + String(item[0]).padStart(2, "0") + '</span><div><strong>' + item[1] + '</strong><span>' + item[2] + '</span></div></div>';
      }).join("");
      return '<div class="chapter-map-backdrop"><section class="chapter-map-card" role="dialog" aria-modal="true" aria-label="章节进度">' +
        '<header class="chapter-map-header"><h2>案件章节</h2><button class="record-close" data-action="toggle-chapters">返回</button></header>' +
        '<div class="chapter-map-list">' + items + '</div>' +
      '</section></div>';
    }

    function escapeAttribute(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function renderAliasPrompt() {
      if (game.mode !== "alias") return "";
      return '<div class="alias-backdrop"><section class="alias-card" role="dialog" aria-modal="true" aria-label="登记代号">' +
        '<header class="alias-header"><h2>今晚的称呼</h2></header>' +
        '<div class="alias-body"><p class="alias-question">玩家：代号可以写什么？</p>' +
        '<p class="alias-note"><strong>门卫：</strong>可以是你心中的英雄，可以是你想成为的任何人，甚至一种物种。只要今晚有人这样叫你时，你愿意回头。真实姓名仍写在名牌背面，由你亲手封存。</p>' +
        '<input class="alias-input" data-alias-input maxlength="18" value="' + escapeAttribute(game.aliasText) + '" placeholder="写下一个今晚使用的代号">' +
        '<div class="alias-actions"><button class="alias-cancel" data-action="cancel-alias">返回调查</button><button class="alias-submit" data-action="submit-alias"' + (game.aliasText.trim() ? '' : ' disabled') + '>写上代号并封存姓名</button></div></div>' +
      '</section></div>';
    }

    function renderInvitationOpen() {
      if (game.mode !== "invitationOpen") return "";
      return '<div class="modal-backdrop story-choice-backdrop"><section class="story-choice-card invitation-open-card" role="dialog" aria-modal="true" aria-label="打开无名请柬">' +
        '<div class="story-object">' + evidenceIcon("invitation", "story-object-icon") + '<span class="wax-seal" aria-hidden="true">✦</span></div>' +
        '<small>THE SEALED INVITATION</small><h2>信封仍然封着</h2>' +
        '<p>四角星火漆没有被破坏。只有你亲手打开，才能知道它为什么会从门缝来到这里。</p>' +
        '<button class="story-primary-button" data-action="openInvitation">按住火漆，拆开请柬</button>' +
      '</section></div>';
    }

    function renderAttendanceChoice() {
      if (game.mode !== "attendanceChoice") return "";
      return '<div class="modal-backdrop story-choice-backdrop"><section class="story-choice-card attendance-card" role="dialog" aria-modal="true" aria-label="是否参加假面舞会">' +
        '<small>11:07 PM · THE DECISION</small><h2>要去旧礼堂吗？</h2>' +
        '<p>赴约，你会暂时封存姓名，进入一场来历不明的假面舞会；留下，这封没有署名的委托也许永远不会得到回答。</p>' +
        '<div class="story-choice-actions"><button class="story-primary-button" data-action="acceptInvitation"><strong>参加</strong><span>换上礼服，前往旧礼堂</span></button>' +
        '<button class="story-secondary-button" data-action="declineInvitation"><strong>不参加</strong><span>把请柬留在桌上，结束今晚的故事</span></button></div>' +
      '</section></div>';
    }

    function renderDeclinedInvitation() {
      if (game.mode !== "declined") return "";
      return '<div class="modal-backdrop story-choice-backdrop"><section class="story-choice-card declined-card" role="dialog" aria-modal="true" aria-label="未参加舞会">' +
        '<small>THE NIGHT ENDS HERE</small><h2>你没有赴约</h2>' +
        '<p>你把信封放回桌上。午夜过去，礼堂的灯一盏盏熄灭；今晚，没人替你做另一种选择。</p>' +
        '<button class="story-secondary-button" data-action="restart">退出并返回标题</button>' +
      '</section></div>';
    }

    function renderCollectionUnlock() {
      if (game.mode !== "collectionUnlock") return "";
      return '<div class="modal-backdrop story-choice-backdrop"><section class="story-choice-card collection-unlock-card" role="dialog" aria-modal="true" aria-label="用收藏钥匙打开隐藏抽屉">' +
        '<div class="lock-interaction"><div class="jar-lock" aria-hidden="true"><span></span></div>' + evidenceIcon("collectionKey", "unlock-key-icon") + '</div>' +
        '<small>RESONANCE LOCK · MANUAL RELEASE</small><h2>玻璃罐形锁孔</h2>' +
        '<p>钥匙已经生成，但抽屉还没有打开。把钥匙对准锁孔，再亲手转动。</p>' +
        '<button class="story-primary-button" data-action="turnCollectionKey">插入钥匙并转动</button>' +
      '</section></div>';
    }

    function renderEnding() {
      return '<section class="game-shell"><div class="end-panel"><div class="end-card">' +
        '<span class="chapter-kicker">THE NAME RETURNED</span>' +
        '<p class="end-question">封印姓名的我们，会失去什么？</p>' +
        '<h1>失去束缚，获得新生。</h1>' +
        '<p>姓名被原样归还。被看见的那些选择，也不必再藏回面具下面。</p>' +
        '<button class="start-button" data-action="restart">从请柬重新开始</button>' +
      '</div></div>' + renderAudioControls() + '</section>';
    }

    function renderTitle() {
      const continueButton = hasSavedGame() ? '<button class="start-button continue-button" data-action="continue-game">继续上次进度</button>' : "";
      return '<section class="game-shell title-screen">' +
        '<div class="scene-bg" style="background-image:url(' + assets.invitation + ')"></div>' +
        renderAudioControls() +
        '<div class="title-panel">' +
          '<span class="title-case">LOST NAME NIGHT</span>' +
          '<h1>面具之下</h1>' +
          '<p>封印姓名的我们，会失去什么？</p>' +
          '<div class="title-actions">' + continueButton + '<button class="start-button" data-action="start">开始故事</button></div>' +
        '</div>' +
      '</section>';
    }

    function renderNotebookRails() {
      return '<aside class="notebook-rail notebook-left">' +
        '<header class="rail-header"><small>CASE PROGRESS</small><h2>失名之夜</h2></header>' +
        '<div class="chapter-list">' + chapterSteps() + '</div>' +
        '<div class="rail-objective"><strong>当前目标</strong><br>' + sceneState().objective + '</div>' +
      '</aside>' +
      '<aside class="notebook-rail notebook-right">' +
        '<header class="rail-header"><small>COURT RECORD</small><h2>证物簿 · ' + game.evidence.length + '</h2></header>' +
        '<div class="mini-evidence-list">' + renderEvidenceCards(true) + renderAssociations() + '</div>' +
      '</aside>';
    }

    function renderGame() {
      if (game.mode === "title") return renderTitle();
      if (game.mode === "ending") return renderEnding();
      const scene = sceneState();
      const sceneAsset = game.scene === "collection" && game.flags.collectionDrawerOpened
        ? assets.collectionOpen
        : game.scene === "kitchen" && game.flags.hook4
          ? assets.kitchenOpen
          : scene.asset;
      const progress = evidenceCountForScene();
      const complete = isSceneComplete();
      return '<section class="game-shell' + (game.evidenceOpen ? '' : ' evidence-collapsed') + (game.mode === "investigate" ? ' investigating' : '') + (game.mode === "dialogue" ? ' dialoguing' : '') + emotionClass() + '">' +
        '<div class="scene-bg" style="background-image:url(' + sceneAsset + ')"></div>' +
        renderSystemControls() +
        renderAudioControls() +
        '<header class="top-hud">' +
          '<div class="case-mark"><span class="case-number">00</span><div class="case-copy"><strong>' + chapterTitle() + '</strong><span>面具之下 · 失名之夜</span></div></div>' +
          '<div class="objective-chip"><strong>当前目标</strong><span>' + scene.objective + '</span></div>' +
          '<div class="progress-chip"><span>' + progress[0] + ' / ' + progress[1] + '</span><span class="progress-dots">' +
            Array.from({length: Math.max(progress[1], 1)}, function(_, i) { return '<i class="progress-dot ' + (i < progress[0] ? 'done' : '') + '"></i>'; }).join('') +
          '</span></div>' +
        '</header>' +
        '<div class="scene-title"><span>' + scene.title + '</span></div>' +
        renderStageSpeaker() +
        renderHotspots() +
        renderInvestigationCursor() +
        renderTalkButton() +
        renderProgressionTip() +
        (complete && game.mode === "investigate" ? '<button class="next-scene-button" data-action="' + scene.nextAction + '">' + scene.nextLabel + '</button>' : '') +
        renderShiyiEntrance() +
        renderDialogue() +
        renderEvidenceRail() +
        renderTalkMenu() +
        renderPresentationMenu() +
        renderInvitationOpen() +
        renderAttendanceChoice() +
        renderDeclinedInvitation() +
        renderAliasPrompt() +
        renderHook() +
        renderCollectionUnlock() +
        renderDeduction() +
        renderChapterModal() +
        renderChapterMap() +
        renderSystemToast() +
        renderEvidenceAcquisition() +
      '</section>';
    }

    function render() {
      if (typeof mount === "function") mount();
    }
    const stage = document.getElementById('stage');

    function mount() {
      stage.innerHTML = renderGame();
      syncBackgroundMusic();
    }

    mount();

    stage.addEventListener("click", function(event) {
      const objectButton = event.target.closest("[data-object]");
      if (objectButton) {
        unlockAudio();
        inspectObject(objectButton.dataset.object);
        return;
      }
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      unlockAudio();
      if (action === "toggle-audio") {
        toggleAudio();
        return;
      }
      playSfx("click");
      if (action === "start") startGame();
      else if (action === "continue-game") continueGame();
      else if (action === "advance") advanceDialogue();
      else if (action === "exit-dialogue") exitDialogue();
      else if (action === "open-talk") openTalk();
      else if (action === "close-talk") closeTalk();
      else if (action === "select-talk-speaker") openTalk(actionButton.dataset.speaker);
      else if (action === "talk-topic") discussTopic(actionButton.dataset.topic);
      else if (action === "open-presentation") openPresentation();
      else if (action === "close-presentation") openTalk(game.talkSpeaker);
      else if (action === "present-evidence") presentEvidence(actionButton.dataset.evidence);
      else if (action === "select-evidence") {
        game.evidenceSelected = actionButton.dataset.evidence;
        render();
      }
      else if (action === "toggle-evidence") {
        game.evidenceOpen = !game.evidenceOpen;
        render();
      }
      else if (action === "dismiss-evidence") {
        game.evidenceNoticeQueue.shift();
        render();
      }
      else if (action === "save-game") saveGame(true);
      else if (action === "return-title") returnToTitle();
      else if (action === "toggle-chapters") {
        game.chapterMapOpen = !game.chapterMapOpen;
        render();
      }
      else if (action === "submit-alias") submitAlias();
      else if (action === "cancel-alias") runAction("investigate");
      else if (action === "submit-hook") submitHook();
      else if (action === "reveal-mirror-light") revealMirrorLight();
      else if (action === "repair-radio") repairRadio();
      else if (action === "compare-melody") compareMelody();
      else if (action === "match-costume") matchCostume();
      else if (action === "compare-handwriting") compareHandwriting();
      else if (action === "next-chapter") runAction("nextChapter");
      else if (action === "restart") runAction("restart");
      else runAction(action);
    });

    document.addEventListener("keydown", function(event) {
      if (!game.evidenceNoticeQueue.length) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      playSfx("click");
      game.evidenceNoticeQueue.shift();
      render();
    });

    stage.addEventListener("input", function(event) {
      if (event.target.matches("[data-audio-volume]")) {
        setAudioVolume(event.target.value);
        return;
      }
      if (event.target.matches("[data-alias-input]")) {
        game.aliasText = event.target.value;
        const button = stage.querySelector('[data-action="submit-alias"]');
        if (button) button.disabled = !game.aliasText.trim();
        return;
      }
      if (!event.target.matches("[data-hook-input]")) return;
      game.hookText = event.target.value;
      const button = stage.querySelector('[data-action="submit-hook"]');
      if (button) button.disabled = !game.hookText.trim();
    });

    stage.addEventListener("pointermove", function(event) {
      const cursor = stage.querySelector(".investigation-cursor");
      if (!cursor) return;
      const rect = stage.getBoundingClientRect();
      cursor.style.left = (event.clientX - rect.left) + "px";
      cursor.style.top = (event.clientY - rect.top) + "px";
      const validTarget = event.target.closest("[data-object]");
      const overUi = event.target.closest(".evidence-tab, .court-record, .system-controls, .chapter-map-card, .next-scene-button, .talk-button, .investigate-tip");
      const cursorLabel = cursor.querySelector("span");
      if (cursorLabel) cursorLabel.textContent = validTarget ? validTarget.dataset.label : "";
      cursor.classList.toggle("valid", Boolean(validTarget));
      cursor.classList.toggle("ui-hidden", Boolean(overUi));
    });

    stage.addEventListener("pointerleave", function() {
      const cursor = stage.querySelector(".investigation-cursor");
      if (cursor) cursor.classList.add("ui-hidden");
    });
  </script>
</body>
</html>
